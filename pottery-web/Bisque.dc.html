          var a = root && (root.querySelector('a[data-nav="' + dir + '"]') || root.querySelector('a[aria-label="' + (dir === 'next' ? '다음 공정' : '이전 공정') + '"]'));
          if (a) { a.click(); } else { self.setState({ navDx: 0 }); }
        }, 0);
      },
      navClickCap: function (e) { if (self.navMoved) { e.preventDefault(); e.stopPropagation(); self.navMoved = false; } }
    };
  }
}
</script>
</body>
</html>
