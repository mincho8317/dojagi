<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2B1A0F">
<title>설정</title>
<script src="./support.js"></script>
<script src="./shared.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
.bg-bg-codex{background:#A7906F url(_blob/59d53b66a9052ce3d7212fad21356d9f.webp) center/cover no-repeat}
.fb-text{all:unset;display:block;box-sizing:border-box;width:100%;min-height:62px;padding:8px 10px;border-radius:12px;background:#FFFDF5;border:2px solid #C9A27A;font-family:'Noto Sans KR',system-ui,sans-serif;font-size:13px;line-height:1.5;color:#2B1A0F;white-space:pre-wrap;resize:none}
.fb-text:focus{border-color:#5B3A24;box-shadow:0 0 0 3px rgba(255,214,107,.6)}
.fb-text::placeholder{color:#A8987C}
@keyframes popIn{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
</style>
</helmet>
<div class="bg-bg-codex" style="position:relative;width:390px;height:844px;box-sizing:border-box;overflow:hidden;color:#2B1A0F;padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px">

  <div style="position:relative;display:flex;align-items:center;gap:10px">
    <a href="Main.dc.html" aria-label="공방으로 돌아가기" style="flex:0 0 46px;height:46px;box-sizing:border-box;border-radius:50%;background:#FFF4DE;border:3px solid #5B3A24;box-shadow:0 3px 0 #5B3A24;display:flex;align-items:center;justify-content:center;color:#5B3A24">
      <svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"></path></svg>
    </a>
    <div style="flex:1 1 auto;height:40px;display:flex;align-items:center;justify-content:center;background:#B9533A;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);font-family:'Jua',sans-serif;font-size:19px;color:#FFF4DE;text-shadow:0 2px 0 #7A2F1E">설정</div>
    <span style="flex:0 0 46px"></span>
  </div>

  <div style="position:relative;flex:1 1 auto;min-height:0;box-sizing:border-box;padding:14px;background:#FFF4DE;border:4px solid #5B3A24;border-radius:20px;box-shadow:inset 0 0 0 3px #F0D9AE,0 5px 0 rgba(43,26,15,.45);overflow-y:auto;display:flex;flex-direction:column;gap:14px">

    <section aria-label="피드백" style="display:flex;flex-direction:column;gap:8px">
      <button type="button" onClick="{{fbOpen}}" style="all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:linear-gradient(#FFE7A8,#F6C96B);border:3px solid #B8923F;box-shadow:0 4px 0 #8A6410">
        <span aria-hidden="true" style="flex:0 0 44px;height:44px;border-radius:50%;background:#FFF4DE;border:3px solid #8A6410;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:24px;color:#E3B23C">★</span>
        <span style="flex:1 1 auto;display:flex;flex-direction:column;gap:2px">
          <span style="font-family:'Jua',sans-serif;font-size:19px;color:#2B1A0F">피드백 보내기</span>
          <span style="font-size:11.5px;font-weight:700;color:#5B3A24">별점과 좋았던 점 · 아쉬운 점을 알려주세요</span>
        </span>
        <span aria-hidden="true" style="font-family:'Jua',sans-serif;font-size:22px;color:#5B3A24">›</span>
      </button>
      <span style="font-size:11px;color:#7A5434;text-align:center">{{fbCountText}}</span>
    </section>

    <section aria-label="사운드" style="display:flex;flex-direction:column;gap:8px">
      <span style="font-family:'Jua',sans-serif;font-size:16px;color:#5B3A24">사운드</span>
      <sc-for list="{{vols}}" as="v" hint-placeholder-count="2">
        <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:#F3E3C4;border:2px solid #C9A27A">
          <span style="flex:0 0 64px;font-family:'Jua',sans-serif;font-size:14px;color:#2B1A0F">{{v.label}}</span>
          <button type="button" onClick="{{v.down}}" aria-label="{{v.label}} 줄이기" style="all:unset;cursor:pointer;flex:0 0 30px;height:30px;border-radius:50%;background:#FFF4DE;border:2px solid #5B3A24;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:18px;color:#5B3A24">−</button>
          <span role="meter" aria-label="{{v.label}} {{v.val}}%" style="flex:1 1 auto;display:flex;gap:3px">
            <sc-for list="{{v.bars}}" as="b" hint-placeholder-count="5">
              <span style="{{b}}"></span>
            </sc-for>
          </span>
          <button type="button" onClick="{{v.up}}" aria-label="{{v.label}} 키우기" style="all:unset;cursor:pointer;flex:0 0 30px;height:30px;border-radius:50%;background:#FFF4DE;border:2px solid #5B3A24;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:18px;color:#5B3A24">+</button>
        </div>
      </sc-for>
    </section>

    <section aria-label="게임" style="display:flex;flex-direction:column;gap:8px">
      <span style="font-family:'Jua',sans-serif;font-size:16px;color:#5B3A24">게임</span>
      <sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
        <button type="button" role="switch" aria-checked="{{t.on}}" onClick="{{t.tap}}" style="all:unset;cursor:pointer;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:#F3E3C4;border:2px solid #C9A27A">
          <span style="flex:1 1 auto;display:flex;flex-direction:column;gap:1px">
            <span style="font-family:'Jua',sans-serif;font-size:14px;color:#2B1A0F">{{t.label}}</span>
            <span style="font-size:10.5px;color:#7A5434">{{t.desc}}</span>
          </span>
          <span style="{{t.track}}"><span style="{{t.knob}}"></span></span>
        </button>
      </sc-for>
    </section>

    <section aria-label="데이터" style="display:flex;flex-direction:column;gap:8px">
      <span style="font-family:'Jua',sans-serif;font-size:16px;color:#5B3A24">데이터</span>
      <button type="button" onClick="{{tutAgain}}" style="all:unset;cursor:pointer;box-sizing:border-box;text-align:center;padding:11px 0;border-radius:14px;font-family:Jua,sans-serif;font-size:15px;background:#FFFDF5;border:2px solid #5B3A24;color:#5B3A24">튜토리얼 처음부터 다시 하기</button>
      <button type="button" onClick="{{reset}}" style="{{resetStyle}}">{{resetLabel}}</button>
      <span style="font-size:10.5px;color:#7A5434;text-align:center">진행 상황은 이 기기에만 저장돼요</span>
    </section>

    <div style="margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:6px;border-top:2px dashed #E1CDA9">
      <span style="font-family:'Jua',sans-serif;font-size:13px;color:#7A5434">도자기 공방</span>
      <span style="font-size:10.5px;color:#A8987C">{{version}}</span>
    </div>
  </div>

  <sc-if value="{{fbShow}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;left:0;top:0;width:390px;height:844px;z-index:60;background:rgba(26,15,8,.6);display:flex;align-items:flex-end">
      <div role="dialog" aria-label="피드백 보내기" style="width:390px;height:790px;box-sizing:border-box;padding:16px 14px 16px;background:#FFF4DE;border-top:4px solid #5B3A24;border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-family:'Jua',sans-serif;font-size:20px;color:#2B1A0F">피드백 보내기</span><span style="font-size:11.5px;color:#7A5434">솔직한 의견이 게임을 더 좋게 만들어요</span></div>
          <button type="button" onClick="{{fbClose}}" aria-label="닫기" style="all:unset;cursor:pointer;margin-left:auto;flex:0 0 42px;height:42px;box-sizing:border-box;border-radius:50%;background:#5B3A24;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:20px;color:#FFE7A8">✕</button>
        </div>

        <sc-if value="{{fbForm}}" hint-placeholder-val="{{true}}">
          <div style="flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:2px">
            <div style="display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border-radius:16px;background:#F3E3C4">
              <span style="font-family:'Jua',sans-serif;font-size:15px;color:#5B3A24">전체적으로 어땠나요?</span>
              <div role="radiogroup" aria-label="별점" style="display:flex;gap:4px">
                <sc-for list="{{stars}}" as="st" hint-placeholder-count="5">
                  <button type="button" role="radio" aria-checked="{{st.on}}" aria-label="{{st.n}}점" onClick="{{st.tap}}" style="{{st.style}}">★</button>
                </sc-for>
              </div>
              <span style="font-size:12px;font-weight:700;color:#8A6410;min-height:16px">{{starText}}</span>
            </div>

            <div style="display:flex;flex-direction:column;gap:6px">
              <span style="font-family:'Jua',sans-serif;font-size:15px;color:#2F6328">👍 좋았던 부분</span>
              <div style="display:flex;flex-wrap:wrap;gap:6px">
                <sc-for list="{{goodChips}}" as="c" hint-placeholder-count="6">
                  <button type="button" aria-pressed="{{c.on}}" onClick="{{c.tap}}" style="{{c.style}}">{{c.label}}</button>
                </sc-for>
              </div>
              <textarea id="fb-good" class="fb-text" rows="3" maxlength="500" placeholder="어떤 부분이 좋았는지 자유롭게 적어주세요"></textarea>
            </div>

            <div style="display:flex;flex-direction:column;gap:6px">
              <span style="font-family:'Jua',sans-serif;font-size:15px;color:#A33B22">🤔 아쉬웠던 부분</span>
              <div style="display:flex;flex-wrap:wrap;gap:6px">
                <sc-for list="{{badChips}}" as="c" hint-placeholder-count="6">
                  <button type="button" aria-pressed="{{c.on}}" onClick="{{c.tap}}" style="{{c.style}}">{{c.label}}</button>
                </sc-for>
              </div>
              <textarea id="fb-bad" class="fb-text" rows="3" maxlength="500" placeholder="어떤 부분이 아쉬웠는지, 어디서 막혔는지 적어주세요"></textarea>
            </div>
          </div>
          <button type="button" onClick="{{fbSubmit}}" aria-disabled="{{fbDisabled}}" style="{{fbSubmitStyle}}">{{fbSubmitLabel}}</button>
        </sc-if>

        <sc-if value="{{fbDone}}" hint-placeholder-val="{{false}}">
          <div style="flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;animation:popIn .5s both">
            <span aria-hidden="true" style="width:96px;height:96px;border-radius:50%;background:#FFE7A8;border:4px solid #B8923F;display:flex;align-items:center;justify-content:center;font-size:48px;color:#E3B23C">★</span>
            <span style="font-family:'Jua',sans-serif;font-size:22px;color:#2B1A0F">소중한 의견 고마워요!</span>
            <span style="font-size:13px;line-height:1.6;color:#5B3A24;white-space:pre-line">{{doneText}}</span>
          </div>
          <button type="button" onClick="{{fbClose}}" style="all:unset;cursor:pointer;box-sizing:border-box;display:block;text-align:center;padding:14px 0;border-radius:16px;background:#4A9440;border:3px solid #2F6328;box-shadow:0 4px 0 #2F6328;font-family:'Jua',sans-serif;font-size:19px;color:#FFFDF5">확인</button>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{toastOn}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position:absolute;left:40px;right:40px;top:380px;z-index:80;padding:12px 14px;border-radius:16px;background:rgba(43,26,15,.92);border:3px solid #FFE7A8;font-family:'Jua',sans-serif;font-size:14px;color:#FFF4DE;text-align:center">{{toast}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { g: this.loadG(), fb: false, fbSent: false, star: 0, good: {}, bad: {}, armed: false, toast: '', sending: false };
  }
  // 피드백 수집 주소 (구글 시트 Apps Script 웹 앱). 비어 있으면 이 기기에만 저장한다.
  fbEndpoint() {
    return { url: 'https://script.google.com/macros/s/AKfycbx4J0VLplFVF1OXrAevegP6dJRuJ556-y_fFRJteDANhWKJnAsB80DC5duPF7G2zqqeDw/exec' };
  }
  loadG() {
    var d = { settings: { bgm: 70, sfx: 80, vib: true, notify: true, hints: true }, feedbacks: [] };
    try { var r = localStorage.getItem('pottery-proto-v1'); if (r) { var o = JSON.parse(r); for (var k in o) { d[k] = o[k]; } } } catch (e) {}
    if (!d.settings) { d.settings = { bgm: 70, sfx: 80, vib: true, notify: true, hints: true }; }
    return d;
  }
  setG(p) {
    var c = this.loadG(), g = {};
    for (var k in c) { g[k] = c[k]; }
    for (var j in p) { g[j] = p[j]; }
    try { localStorage.setItem('pottery-proto-v1', JSON.stringify(g)); } catch (e) {}
    this.setState({ g: g });
  }
  setS(k, v) {
    var st = {}, cur = this.state.g.settings || {};
    for (var a in cur) { st[a] = cur[a]; }
    st[k] = v;
    this.setG({ settings: st });
  }
  tutBoot() { return window.PotteryShared.tutBoot.call(this, 'Settings'); }
  sndBoot() { return window.PotteryShared.sndBoot.call(this); }
  qlib() { return window.PotteryShared.qlib.call(this); }
  navBoot() { return window.PotteryShared.navBoot.call(this); }
  trackBoot() { return window.PotteryShared.trackBoot.call(this); }
  componentDidMount() {
    try { this.tutBoot(); } catch (e) {}
    try { this.sndBoot(); } catch (e) {}
    var selfB = this; setTimeout(function () { try { selfB.navBoot(); } catch (e) {} }, 0);
    var self = this;
    this.onStore = function (e) { if (!e || e.key === 'pottery-proto-v1' || e.key === null) { self.setState({ g: self.loadG() }); } };
    try { window.addEventListener('storage', this.onStore); } catch (e) {}
  }
  componentWillUnmount() {
    clearTimeout(this.tt);
    try { window.removeEventListener('storage', this.onStore); } catch (e) {}
  }
  say(msg) {
    var self = this;
    clearTimeout(this.tt);
    this.setState({ toast: msg });
    this.tt = setTimeout(function () { self.setState({ toast: '' }); }, 1800);
  }
  readText(id) {
    try { var el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; } catch (e) { return ''; }
  }
  submit() {
    var s = this.state, self = this;
    if (!s.star) { this.say('별점을 먼저 골라주세요'); return; }
    if (s.sending) { return; }
    var g = s.g, ps = g.pieces || {}, pn = 0;
    for (var k in ps) { pn++; }
    var pick = function (o) { return Object.keys(o).filter(function (x) { return o[x]; }); };
    var fb = {
      at: new Date().toISOString(), star: s.star,
      good: pick(s.good), goodText: this.readText('fb-good'),
      bad: pick(s.bad), badText: this.readText('fb-bad'),
      meta: { gold: g.gold, fameLv: g.fameLv, pieces: pn, firings: g.firings, ua: (typeof navigator !== 'undefined' ? navigator.userAgent : '').slice(0, 160), w: (typeof window !== 'undefined' ? window.innerWidth + 'x' + window.innerHeight : '') }
    };
    var list = (g.feedbacks || []).concat([fb]).slice(-30);
    this.setG({ feedbacks: list });
    var ep = this.fbEndpoint();
    if (ep.url) {
      this.setState({ sending: true });
      try {
        fetch(ep.url, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(fb) }).then(function () { self.setState({ sending: false, fbSent: true, sentRemote: true }); }, function () { self.setState({ sending: false, fbSent: true, sentRemote: false }); });
      } catch (e) { this.setState({ sending: false, fbSent: true, sentRemote: false }); }
    } else {
      this.setState({ fbSent: true, sentRemote: false });
    }
  }
  renderVals() {
    var self = this, s = this.state, g = s.g, st = g.settings || {};
    function bars(v) { var out = []; for (var i = 1; i <= 10; i++) { out.push('flex:1 1 0;height:' + (8 + i * 1.4).toFixed(1) + 'px;align-self:flex-end;border-radius:3px;background:' + (i * 10 <= v ? '#C8601E' : '#E1CDA9')); } return out; }
    var vols = [{ k: 'bgm', label: '배경음' }, { k: 'sfx', label: '효과음' }].map(function (d) {
      var v = st[d.k] == null ? 70 : st[d.k];
      return { label: d.label, val: v, bars: bars(v), down: function () { self.setS(d.k, Math.max(0, v - 10)); }, up: function () { self.setS(d.k, Math.min(100, v + 10)); } };
    });
    var toggles = [
      { k: 'vib', label: '진동', desc: '물레 성공·실패, 가마 열기 때 진동' },
      { k: 'notify', label: '완료 알림', desc: '건조·초벌·소성이 끝나면 알림' },
      { k: 'hints', label: '조작 가이드', desc: '물레 양손 잡기 등 처음 조작 안내 보기' }
    ].map(function (d) {
      var on = st[d.k] !== false;
      return {
        label: d.label, desc: d.desc, on: on ? 'true' : 'false',
        track: 'position:relative;flex:0 0 48px;height:28px;border-radius:14px;box-sizing:border-box;border:2px solid ' + (on ? '#2F6328' : '#8A7A63') + ';background:' + (on ? '#5FB052' : '#CFC5B4'),
        knob: 'position:absolute;top:2px;left:' + (on ? 22 : 2) + 'px;width:20px;height:20px;border-radius:50%;background:#FFFDF5;box-shadow:0 1px 2px rgba(0,0,0,.35);transition:left .15s',
        tap: function () { self.setS(d.k, !on); }
      };
    });
    var GOOD = ['물레 손맛', '그래픽·분위기', '가마 열기 연출', '손님·의뢰 이야기', '진열·판매', '수집·도감', '봄 축제 이벤트'];
    var BAD = ['조작이 어려움', '설명이 부족함', '진행이 느림', '버그·오류', '화면이 복잡함', '보상이 부족함', '글씨가 작음'];
    function chips(arr, key, col) {
      return arr.map(function (lb) {
        var on = !!(s[key] || {})[lb];
        return {
          label: lb, on: on ? 'true' : 'false',
          style: 'all:unset;cursor:pointer;padding:6px 11px;border-radius:14px;font-family:Jua,sans-serif;font-size:13px;' + (on ? 'background:' + col + ';color:#FFFDF5;border:2px solid ' + col : 'background:#FFFDF5;color:#5B3A24;border:2px solid #C9A27A'),
          tap: function () { var o = {}; for (var x in (s[key] || {})) { o[x] = s[key][x]; } o[lb] = !o[lb]; var p = {}; p[key] = o; self.setState(p); }
        };
      });
    }
    var STAR_T = ['', '별로였어요', '아쉬웠어요', '보통이에요', '재밌어요', '최고예요!'];
    var stars = [1, 2, 3, 4, 5].map(function (n) {
      var on = n <= s.star;
      return { n: n, on: n === s.star ? 'true' : 'false', tap: function () { self.setState({ star: n }); },
        style: 'all:unset;cursor:pointer;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:40px;line-height:1;transition:transform .12s;' + (on ? 'color:#F2B33D;text-shadow:0 2px 0 #B8862A;transform:scale(1.08)' : 'color:#D8C6A6') };
    });
    var fbs = g.feedbacks || [];
    var armed = s.armed;
    return {
      vols: vols, toggles: toggles,
      fbCountText: fbs.length ? '지금까지 ' + fbs.length + '번 의견을 보냈어요 · 고마워요!' : '플레이 중 느낀 점을 언제든 남겨주세요',
      fbOpen: function () { self.setState({ fb: true, fbSent: false, star: 0, good: {}, bad: {} }); },
      fbClose: function () { self.setState({ fb: false, fbSent: false }); },
      fbShow: !!s.fb, fbForm: !!s.fb && !s.fbSent, fbDone: !!s.fb && !!s.fbSent,
      stars: stars, starText: STAR_T[s.star] || '별을 눌러 점수를 주세요',
      goodChips: chips(GOOD, 'good', '#4A9440'), badChips: chips(BAD, 'bad', '#C8601E'),
      fbDisabled: s.star ? 'false' : 'true',
      fbSubmit: function () { self.submit(); },
      fbSubmitLabel: s.sending ? '보내는 중…' : (s.star ? '피드백 보내기' : '별점을 먼저 골라주세요'),
      fbSubmitStyle: 'all:unset;cursor:pointer;box-sizing:border-box;display:block;text-align:center;padding:14px 0;border-radius:16px;font-family:Jua,sans-serif;font-size:19px;' + (s.star ? 'background:#4A9440;border:3px solid #2F6328;box-shadow:0 4px 0 #2F6328;color:#FFFDF5' : 'background:#D9CDB8;border:3px solid #B5A486;color:#8A7A63'),
      doneText: (s.sentRemote ? '개발팀에 전달됐어요.' : '이 기기에 저장됐어요.') + '\n보내주신 의견은 다음 업데이트에 반영할게요.',
      resetLabel: armed ? '한 번 더 누르면 처음 상태로 돌아가요' : '진행 상황 초기화',
      resetStyle: 'all:unset;cursor:pointer;box-sizing:border-box;text-align:center;padding:11px 0;border-radius:14px;font-family:Jua,sans-serif;font-size:15px;' + (armed ? 'background:#B9533A;border:3px solid #7A2F1E;color:#FFFDF5;' : 'background:#FFFDF5;border:2px solid #B9533A;color:#B9533A;'),
      reset: function () {
        if (!armed) { self.setState({ armed: true }); return; }
        var keep = { settings: g.settings, feedbacks: g.feedbacks };
        try { localStorage.setItem('pottery-proto-v1', JSON.stringify(keep)); } catch (e) {}
        self.setState({ g: self.loadG(), armed: false });
        self.say('진행 상황이 처음으로 돌아갔어요 · 설정과 피드백은 유지');
      },
      tutAgain: function () {
        try { var o = JSON.parse(localStorage.getItem('pottery-proto-v1') || '{}'); delete o.tut; localStorage.setItem('pottery-proto-v1', JSON.stringify(o)); ['tutProg', 'tutCardSeen', 'tutJade_dry', 'tutJade_bq', 'tutJade_kiln'].forEach(function (k) { localStorage.removeItem(k); }); Object.keys(localStorage).forEach(function (k) { if (/^tutWh_/.test(k)) { localStorage.removeItem(k); } }); Object.keys(sessionStorage).forEach(function (k) { if (/^tut/.test(k)) { sessionStorage.removeItem(k); } }); self.setState({ g: self.loadG() }); } catch (e) {}
        self.say('공방으로 돌아가면 튜토리얼 시작 안내가 나와요');
      },
      version: '버전 0.9 · 2026.11.07',
      toast: s.toast, toastOn: s.toast !== ''
    };
  }
}
