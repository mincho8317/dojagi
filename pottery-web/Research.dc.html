<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2B1A0F">
<title>연구</title>
<script src="./support.js"></script>
<script src="./shared.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif}
a{color:#5B3A24}a:hover{color:#3E2616}
button{font-family:inherit;cursor:pointer}
.bg-bg-research-map{background:#E8D3B5 url(_blob/ab3d972d0256de40fbd19a350a1fb2a8.webp) center/100% 100% no-repeat}
@keyframes resPop{0%{transform:translate(-50%,0) scale(.5);opacity:0}30%{transform:translate(-50%,-6px) scale(1.15);opacity:1}100%{transform:translate(-50%,-30px) scale(1);opacity:0}}
@keyframes navPulse{0%,100%{opacity:.85}50%{opacity:1}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#8C7A62;color:#2B1A0F">

  <div style="position:absolute;left:12px;right:12px;top:10px;display:flex;align-items:center;gap:8px">
    <div style="flex:1 1 auto;height:42px;display:flex;align-items:center;justify-content:center;background:#B9533A;clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%);font-family:'Jua',sans-serif;font-size:20px;color:#FFF4DE;text-shadow:0 2px 0 #7A2F1E">연구 · 기술 나무</div>
    <div style="display:flex;flex-direction:column;gap:3px">
      <span aria-label="파편 {{shards}}" style="display:flex;align-items:center;gap:4px;height:20px;padding:0 9px 0 4px;border-radius:10px;background:rgba(43,26,15,.85);font-family:'Jua',sans-serif;font-size:14px;color:#BFF0DE"><img src="_blob/42ba2694aff99a86b951a80fe9936a43.webp" alt="" aria-hidden="true" style="width:18px;height:18px;object-fit:contain">{{shards}}</span>
      <span aria-label="골드 {{goldTxt}}" style="display:flex;align-items:center;gap:4px;height:20px;padding:0 9px 0 4px;border-radius:10px;background:rgba(43,26,15,.85);font-family:'Jua',sans-serif;font-size:14px;color:#FFD66B"><img src="_blob/ea2f92f9715f11442fcbe68ac6fe0508.webp" alt="" aria-hidden="true" style="width:18px;height:18px;object-fit:contain">{{goldTxt}}</span>
    </div>
  </div>

  <div role="tablist" aria-label="연구 계열" style="position:absolute;left:12px;right:12px;top:60px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px">
    <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="5">
      <button type="button" role="tab" aria-selected="{{tb.on}}" onClick="{{tb.pick}}" style="{{tb.style}}"><span>{{tb.label}}</span><span style="{{tb.subStyle}}">{{tb.sub}}</span></button>
    </sc-for>
  </div>

  <div id="rtree" class="bg-bg-research-map" style="position:absolute;left:12px;right:12px;top:114px;height:392px;box-sizing:border-box;border-radius:16px;overflow-x:hidden;overflow-y:auto;box-shadow:0 4px 0 rgba(43,26,15,.35);-webkit-overflow-scrolling:touch">
    <div style="{{treeBox}}">
      <svg style="position:absolute;left:0;top:0" width="362" height="{{treeH}}" aria-hidden="true">
        <sc-for list="{{edges}}" as="e" hint-placeholder-count="4">
          <path d="{{e.d}}" fill="none" stroke="{{e.c}}" stroke-width="{{e.w}}" stroke-linecap="round" stroke-dasharray="{{e.dash}}"></path>
        </sc-for>
      </svg>
      <sc-for list="{{nodes}}" as="n" hint-placeholder-count="6">
        <button type="button" onClick="{{n.pick}}" aria-label="{{n.aria}}" aria-pressed="{{n.on}}" style="{{n.style}}">
          <span style="{{n.iconStyle}}">{{n.icon}}</span>
          <span style="{{n.nameStyle}}">{{n.name}}</span>
          <span style="{{n.fxStyle}}">{{n.fx}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <div style="position:absolute;left:12px;right:12px;top:514px;height:232px;box-sizing:border-box;padding:10px 12px 10px;background:#FFF4DE;border:4px solid #5B3A24;border-radius:20px;box-shadow:inset 0 0 0 3px #F0D9AE,0 5px 0 rgba(43,26,15,.45);display:flex;flex-direction:column;gap:5px">
    <div style="display:flex;align-items:center;gap:6px">
      <span style="font-family:'Jua',sans-serif;font-size:19px;color:#B9533A">{{sel.name}}</span>
      <span style="{{sel.stStyle}}">{{sel.stText}}</span>
      <span style="margin-left:auto;font-size:12px;font-weight:700;color:#5B3A24">대상 · {{sel.target}}</span>
    </div>
    <div style="display:flex;flex-direction:column;gap:3px">
      <sc-for list="{{sel.fx}}" as="f" hint-placeholder-count="1">
        <div style="display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:10px;background:#EAF3E4;border:2px solid #9CC58F">
          <span style="flex:1 1 auto;min-width:0;font-size:13px;font-weight:700;color:#2B1A0F">{{f.label}}</span>
          <span style="font-family:'Jua',sans-serif;font-size:14px;color:#6B6B6B">{{f.before}}</span>
          <span style="font-family:'Jua',sans-serif;font-size:14px;color:#2F6328">→ {{f.after}}</span>
        </div>
      </sc-for>
    </div>
    <span style="font-size:12px;line-height:1.35;color:#5B3A24"><b>선행</b> {{sel.req}} · <b>다음</b> {{sel.next}}</span>
    <span style="{{sel.condStyle}}">{{sel.cond}}</span>
    <div style="margin-top:auto;display:flex;align-items:center;gap:8px">
      <span style="flex:0 0 auto;display:flex;flex-direction:column;gap:1px;font-family:'Jua',sans-serif;font-size:14px">
        <span style="{{sel.shCol}}">파편 {{sel.shards}}</span>
        <span style="{{sel.goCol}}">골드 {{sel.gold}}</span>
      </span>
      <button type="button" onClick="{{doResearch}}" style="{{sel.btnStyle}}">{{sel.btn}}</button>
    </div>
  </div>

  <sc-if value="{{toastOn}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position:absolute;left:36px;right:36px;top:250px;padding:12px 14px;border-radius:16px;background:rgba(43,26,15,.92);border:3px solid #FFE7A8;font-family:'Jua',sans-serif;font-size:15px;color:#FFF4DE;text-align:center;z-index:5">{{toast}}</div>
  </sc-if>
  <sc-if value="{{fxOn}}" hint-placeholder-val="{{false}}">
    <div aria-hidden="true" style="{{fxStyle}}">✦ 연구 완료 ✦</div>
  </sc-if>

  <nav aria-label="주 메뉴" style="position:absolute;left:0;bottom:0;width:390px;height:92px;box-sizing:border-box;padding:0 6px 8px;background:#6B4429;border-top:4px solid #3E2616;box-shadow:inset 0 3px 0 #8A5A36;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:end">
    <a href="Main.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;text-decoration:none">
      <img src="_blob/4d235f31faacd07e94182c72c545cfea.webp" alt="" aria-hidden="true" style="width:40px;height:40px;object-fit:contain">
      <span style="font-family:'Jua',sans-serif;font-size:12px;white-space:nowrap;color:#F6E7CC">공방</span>
    </a>
    <a href="Gather.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;text-decoration:none">
      <img src="_blob/976713d77fcd910c2063a318370be110.webp" alt="" aria-hidden="true" style="width:40px;height:40px;object-fit:contain">
      <span style="font-family:'Jua',sans-serif;font-size:12px;white-space:nowrap;color:#F6E7CC">채집</span>
    </a>
    <a href="Wheel.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;margin-top:-28px">
      <span style="width:70px;height:70px;box-sizing:border-box;border-radius:50%;background:#4A9440;border:4px solid #2F6328;box-shadow:0 4px 0 #2F6328,inset 0 3px 0 #6DB35E;display:flex;align-items:center;justify-content:center">
        <img src="_blob/57df2cdf4d037636e8c5fa366b12ec35.webp" alt="" aria-hidden="true" style="width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))">
      </span>
      <span style="font-family:'Jua',sans-serif;font-size:13px;color:#F6E7CC">제작</span>
    </a>
    <a href="Commission.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;text-decoration:none">
      <img src="_blob/e3f790ef5b7c6af4d706b063f909ab46.webp" alt="" aria-hidden="true" style="width:40px;height:40px;object-fit:contain">
      <span style="font-family:'Jua',sans-serif;font-size:12px;white-space:nowrap;color:#F6E7CC">의뢰</span>
    </a>
    <a href="Shop.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;text-decoration:none">
      <img src="_blob/06f86a4df741dc544193607cfb80c2fb.webp" alt="" aria-hidden="true" style="width:40px;height:40px;object-fit:contain">
      <span style="font-family:'Jua',sans-serif;font-size:12px;white-space:nowrap;color:#F6E7CC">상점</span>
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'form', sel: '', toast: '', g: this.loadG() };
  }
  gdef() {
    return {
      gold: 1240, shards: 142, fameLv: 3, fameXp: 62,
      drying: 1, glazeQ: 2, kilnQ: 0,
      kiln: 'firing', heat: 'mid', kilnFilled: { '0': true, '1': true, '4': true }, firings: 38,
      openIdx: 0, openLog: [],
      trim: false, mats: {}, deco: {},
      quests: { min: false, guest: false, week: false, minDone: false },
      research: {},
      pieces: {
        p1: { name: '청자 찻잔', grade: '수작', shape: 'cup', glaze: 'celadon', where: 'shelf', value: 10900 },
        p2: { name: '백자 달항아리', grade: '명작', shape: 'jar', glaze: 'white', where: 'shelf', value: 24000 },
        p3: { name: '분청 사발', grade: '양작', shape: 'bowl', glaze: 'white', where: 'shelf', value: 3200 },
        p4: { name: '청자 잔', grade: '양작', shape: 'cup', glaze: 'celadon', where: 'shelf', value: 2600 }
      },
      order: ['p1', 'p2', 'p3', 'p4'],
      broken: 0, curator: 'waiting',
      glazesFound: { white: true, celadon: true, black: true },
      shapesFound: { dish: true, cup: true, bowl: true, jar: true }
    };
  }
  loadG() {
    var d = this.gdef();
    try { var r = localStorage.getItem('pottery-proto-v1'); if (r) { var o = JSON.parse(r); for (var k in o) { d[k] = o[k]; } } } catch (e) {}
    return d;
  }
  setG(p) {
    var c = this.state.g, g = {};
    for (var k in c) { g[k] = c[k]; }
    for (var j in p) { g[j] = p[j]; }
    try { localStorage.setItem('pottery-proto-v1', JSON.stringify(g)); } catch (e) {}
    this.setState({ g: g });
  }
  tutBoot() { return window.PotteryShared.tutBoot.call(this, 'Research'); }
  sndBoot() { return window.PotteryShared.sndBoot.call(this); }
  qlib() { return window.PotteryShared.qlib.call(this); }
  navBoot() { return window.PotteryShared.navBoot.call(this); }
  trackBoot() { return window.PotteryShared.trackBoot.call(this); }
  componentDidMount() {
    try { this.tutBoot(); } catch (e) {}
    try { this.sndBoot(); } catch (e) {}
    var selfB = this; setTimeout(function () { try { selfB.navBoot(); } catch (e) {} }, 0);
    try { this.focusRes(); } catch (e) {}
    var self = this;
    this.onStore = function (e) { if (!e || e.key === 'pottery-proto-v1' || e.key === null) { self.setState({ g: self.loadG() }); } };
    try { window.addEventListener('storage', this.onStore); } catch (e) {}
  }
  componentWillUnmount() {
    clearTimeout(this.tt);
    try { window.removeEventListener('storage', this.onStore); } catch (e) {}
  }
  say(msg) {
    var self = this;
    clearTimeout(this.tt);
    this.setState({ toast: msg });
    this.tt = setTimeout(function () { self.setState({ toast: '' }); }, 1800);
  }
  focusRes() {
    var id = ''; try { id = localStorage.getItem('resFocus') || ''; localStorage.removeItem('resFocus'); } catch (e) {}
    var n = this.qlib().RNODE[id]; if (!n) { return; }
    this.setState({ tab: n.cat, sel: id });
    setTimeout(function () { try { var t = document.getElementById('rtree'); if (t) { t.scrollTop = Math.max(0, n.row * 96 - 120); } } catch (e) {} }, 60);
  }
  renderVals() {
    var self = this, s = this.state, g = s.g, QL = this.qlib(), R = g.res || {}, F = QL.fx(g);
    var SHORT = { clayLv: '흙 정제', glazeLv: '유약 발색', refineUp: '추가 획득', matKeep: '원료 절약', tixMax: '채집권', gTime: '채집 시간', comboUp: '콤보 시간', goldUp: '황금 돌', rareUp: '희귀', digWide: '삽 범위', snapTol: '보정 폭', snapRate: '보정 속도', doneTol: '완료 오차', fitBonus: '성형 점수', clayKeep: '흙 절약', dryRack: '건조대', dryCut: '건조 시간', fanZone: '부채 판정', fanGain: '부채 바람', bqCut: '풀무 한도', bqSafe: '반건조 파손', glazeZone: '담금 폭', kilnTol: '정합 온도', kilnCut: '소성 시간', breakCut: '소성 파손', colorMin: '발색 하한', yohen: '요변', sell: '판매가', questGold: '의뢰 골드', shard: '파편', fame: '명성', expand: '공방 확장' };
    var ICON = { mat: '🪨', form: '🏺', dry: '🌬', fire: '🔥', shop: '🏪', gather: '⛏' };
    var cat = s.tab, rows = QL.RROW[cat].map(function (r) { return QL.RNODE[r[0]]; });
    var X = [62, 181, 300], W = 108, H = 74, P = 96, T0 = 12;
    function pos(n) { return { x: X[n.col], y: T0 + n.row * P }; }
    var selId = s.sel && QL.RNODE[s.sel] && QL.RNODE[s.sel].cat === cat ? s.sel : '';
    if (!selId) { var first = rows.filter(function (n) { return QL.resState(g, n.id) === 'ready'; })[0] || rows.filter(function (n) { return QL.resState(g, n.id) !== 'done'; })[0] || rows[0]; selId = first.id; }
    function delta(key, v) { var a = QL.fxVal(key, 0), b = QL.fxVal(key, v), d = b - a; var t = Math.abs(d - Math.round(d)) < 0.001 ? String(Math.round(d)) : (Math.abs(d * 10 - Math.round(d * 10)) < 0.001 ? d.toFixed(1) : d.toFixed(2)); if (key === 'expand') { return '7×9'; } return (d > 0 ? '+' : '') + t + QL.FXM[key].u; }
    function afford(n) { return (g.shards || 0) >= n.shards && (g.gold || 0) >= n.gold; }
    var edges = [];
    rows.forEach(function (n) {
      var c = pos(n);
      n.req.forEach(function (rq) {
        var p0 = QL.RNODE[rq]; if (!p0) { return; } var p = pos(p0);
        var done = !!R[n.id], pd = !!R[rq];
        var y1 = p.y + H, y2 = c.y, my = (y1 + y2) / 2;
        edges.push({ d: 'M' + p.x + ' ' + y1 + ' C' + p.x + ' ' + my + ' ' + c.x + ' ' + my + ' ' + c.x + ' ' + y2, c: done ? '#2F6328' : (pd ? '#C8901E' : 'rgba(62,38,22,.45)'), w: done ? 5 : 4, dash: done ? '0' : (pd ? '0' : '3 7') });
      });
    });
    var nodes = rows.map(function (n) {
      var st = QL.resState(g, n.id), p = pos(n), on = n.id === selId, ok = st === 'ready' && afford(n);
      var k0 = Object.keys(n.fx)[0];
      var bg = { done: '#DDEFD5', ready: '#FFF9EC', cond: '#EDE3F3', locked: '#CFC3AE' }[st], bd = { done: '#2F6328', ready: ok ? '#C8601E' : '#8A6440', cond: '#7A5A93', locked: '#8E8473' }[st];
      return {
        aria: n.name + ' · ' + { done: '완료', ready: ok ? '연구 가능' : '비용 부족', cond: '조건 필요', locked: '잠김' }[st],
        on: on ? 'true' : 'false',
        icon: st === 'done' ? '✓' : (st === 'locked' ? '🔒' : (st === 'cond' ? '!' : ICON[cat])),
        iconStyle: 'position:absolute;left:-6px;top:-8px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-family:Jua,sans-serif;color:#FFF;border:2px solid #FFF4DE;background:' + bd,
        name: n.name, nameStyle: 'font-family:Jua,sans-serif;font-size:13px;line-height:1.15;color:' + (st === 'locked' ? '#3E372D' : '#2B1A0F'),
        fx: SHORT[k0] + ' ' + delta(k0, n.fx[k0]) + (Object.keys(n.fx).length > 1 ? ' 외' : ''),
        fxStyle: 'font-size:11.5px;font-weight:700;color:' + (st === 'locked' ? '#3E372D' : '#2E6B5F'),
        style: 'all:unset;cursor:pointer;position:absolute;left:' + (p.x - W / 2) + 'px;top:' + p.y + 'px;width:' + W + 'px;height:' + H + 'px;box-sizing:border-box;padding:6px 6px 5px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;background:' + bg + ';border:3px solid ' + bd + ';' + (on ? 'box-shadow:0 0 0 3px #FFD66B,0 4px 0 rgba(43,26,15,.35);' : 'box-shadow:0 3px 0 rgba(43,26,15,.3);') + (ok && !on ? 'animation:navPulse 1.4s ease-in-out infinite;' : '') + (st === 'locked' ? 'opacity:.92;' : ''),
        pick: function () { self.setState({ sel: n.id }); try { window.__sfx && window.__sfx('tap'); } catch (e) {} }
      };
    });
    var cur = QL.RNODE[selId], cst = QL.resState(g, selId), canPay = afford(cur);
    var kids = []; for (var id in QL.RNODE) { if (QL.RNODE[id].req.indexOf(selId) >= 0) { kids.push(QL.RNODE[id].name); } }
    var fxRows = Object.keys(cur.fx).map(function (k) {
      var have = F[k] || 0, v = cur.fx[k];
      return { label: QL.FXM[k].t + ' · ' + QL.FXM[k].l, before: cst === 'done' ? QL.fxFmt(k, have - v) : QL.fxFmt(k, have), after: cst === 'done' ? QL.fxFmt(k, have) : QL.fxFmt(k, have + v) };
    });
    var targets = []; Object.keys(cur.fx).forEach(function (k) { if (targets.indexOf(QL.FXM[k].t) < 0) { targets.push(QL.FXM[k].t); } });
    var condTxt = cur.cond && QL.RCOND[cur.cond] ? '조건 · ' + QL.RCOND[cur.cond].t + (QL.RCOND[cur.cond].ok(g) ? ' ✓' : ' (미달)') : '';
    var btn = { done: '연구 완료 ✓', locked: '선행 연구 필요', cond: '조건 미달', ready: canPay ? '연구하기' : ((g.shards || 0) < cur.shards ? '파편 부족' : '골드 부족') }[cst];
    var act = cst === 'ready' && canPay;
    var tabs = QL.RCAT.map(function (c) {
      var on = c.id === cat, all = QL.RROW[c.id].length, dn = QL.RROW[c.id].filter(function (r) { return R[r[0]]; }).length, rd = QL.RROW[c.id].filter(function (r) { return QL.resState(g, r[0]) === 'ready' && afford(QL.RNODE[r[0]]); }).length;
      return {
        label: c.n, on: on ? 'true' : 'false', sub: dn + '/' + all + (rd ? ' · 가능 ' + rd : ''),
        subStyle: 'display:block;font-family:Noto Sans KR,sans-serif;font-size:10.5px;font-weight:700;' + (rd ? 'color:#1F4A1A' : 'color:#4A2E1B'),
        style: 'all:unset;cursor:pointer;box-sizing:border-box;min-height:46px;text-align:center;padding:5px 0 4px;border:3px solid #5B3A24;border-radius:14px 14px 6px 6px;font-family:Jua,sans-serif;font-size:13px;line-height:1.15;word-break:keep-all;' + (on ? 'background:#FFF4DE;box-shadow:0 3px 0 #3E2616;color:#B9533A' : 'background:#C9B08A;color:#3E2616'),
        pick: function () { self.setState({ tab: c.id, sel: '' }); try { var t = document.getElementById('rtree'); if (t) { t.scrollTop = 0; } } catch (e) {} }
      };
    });
    var treeH = T0 + (Math.max.apply(null, QL.RROW[cat].map(function (r) { return r[1]; })) + 1) * P;
    return {
      shards: (g.shards || 0).toLocaleString(), goldTxt: (g.gold || 0).toLocaleString(),
      tabs: tabs, nodes: nodes, edges: edges, treeH: treeH,
      treeBox: 'position:relative;width:362px;height:' + treeH + 'px',
      sel: {
        name: cur.name, target: targets.join(' · '), fx: fxRows,
        stText: { done: '완료', ready: '연구 가능', cond: '조건 필요', locked: '잠김' }[cst],
        stStyle: 'padding:1px 8px;border-radius:8px;font-family:Jua,sans-serif;font-size:12px;color:#FFFDF5;background:' + { done: '#2F6328', ready: '#C8601E', cond: '#7A5A93', locked: '#5E5547' }[cst],
        req: cur.req.length ? cur.req.map(function (q) { return (R[q] ? '✓ ' : '✗ ') + QL.RNODE[q].name; }).join(', ') : '없음 (시작 연구)',
        next: kids.length ? kids.join(', ') : '마지막 연구',
        cond: condTxt, condStyle: condTxt ? 'font-size:12px;font-weight:700;color:' + (QL.RCOND[cur.cond].ok(g) ? '#2F6328' : '#7A5A93') : 'display:none',
        shards: cur.shards.toLocaleString(), gold: cur.gold ? cur.gold.toLocaleString() : '0',
        shCol: 'color:' + ((g.shards || 0) >= cur.shards || cst === 'done' ? '#2E6B5F' : '#A33B22'),
        goCol: 'color:' + ((g.gold || 0) >= cur.gold || cst === 'done' ? '#8A6410' : '#A33B22'),
        btn: btn,
        btnStyle: 'all:unset;cursor:pointer;flex:1 1 auto;box-sizing:border-box;min-height:48px;text-align:center;padding:10px 0;border-radius:16px;font-family:Jua,sans-serif;font-size:18px;' + (act ? 'background:#4A9440;border:3px solid #2F6328;box-shadow:0 4px 0 #2F6328;color:#FFFDF5' : 'background:#CFC5B4;border:3px solid #8E8473;color:#5E5547')
      },
      doResearch: function () {
        if (cst === 'done') { self.say('이미 끝낸 연구예요'); return; }
        if (cst === 'locked') { self.say('선행 연구를 먼저 마쳐야 해요'); return; }
        if (cst === 'cond') { self.say('조건: ' + QL.RCOND[cur.cond].t); return; }
        if (!canPay) { self.say((g.shards || 0) < cur.shards ? '파편이 ' + (cur.shards - (g.shards || 0)) + ' 모자라요' : '골드가 ' + (cur.gold - (g.gold || 0)).toLocaleString() + ' 모자라요'); return; }
        var r2 = {}; for (var k in R) { r2[k] = R[k]; } r2[cur.id] = true;
        self.setG({ res: r2, shards: (g.shards || 0) - cur.shards, gold: (g.gold || 0) - cur.gold });
        try { window.__sfx && window.__sfx('unlock'); } catch (e) {}
        var extra = cur.fx.dryRack ? ' · 건조대 ' + Math.min(9, 3 + (QL.fx({ res: r2 }).dryRack || 0)) + '칸' : (cur.fx.expand ? ' · 공방 바닥 7×9 · 공방에서 배치해 봐요' : '');
        self.say('「' + cur.name + '」 완료' + extra);
        clearTimeout(self.ft); self.setState({ fxAt: Date.now() }); self.ft = setTimeout(function () { self.setState({ fxAt: 0 }); }, 900);
      },
      fxOn: !!s.fxAt,
      fxStyle: 'position:absolute;left:50%;top:470px;transform:translateX(-50%);padding:6px 16px;border-radius:14px;background:#2F6328;border:3px solid #E4F5D8;font-family:Jua,sans-serif;font-size:18px;color:#FFE7A8;white-space:nowrap;z-index:6;pointer-events:none;box-shadow:0 0 20px 6px rgba(255,231,120,.7);animation:resPop .9s ease-out both',
      toast: s.toast,
      toastOn: s.toast !== ''
    };
  }

}
</script>
