      smash: function (t) { noise(t, 0.09, 'lowpass', 1800, 0.7, 0.55); noise(t, 0.6, 'highpass', 2500, 0.6, 0.3, null, 5000); for (var i = 0; i < 9; i++) { var tt = t + 0.04 + Math.random() * 0.45; tone('sine', 2800 + Math.random() * 3800, tt, 0.001, 0.04 + Math.random() * 0.05, 0.08 + Math.random() * 0.12); } tone('sine', 120, t, 0.003, 0.4, 0.25, null, 50); },
      splash: function (t) { noise(t, 0.35, 'bandpass', 900, 1.5, 0.22, null, 350); for (var i = 0; i < 4; i++) { tone('sine', 500 + Math.random() * 600, t + 0.05 + i * 0.05, 0.003, 0.05, 0.08, null, 1200); } },
      drip: function (t) { for (var i = 0; i < 3; i++) { tone('sine', 900 + i * 180, t + i * 0.14, 0.002, 0.06, 0.09, null, 1700); } },
      ignite: function (t) { noise(t, 0.9, 'lowpass', 200, 0.8, 0.4, null, 1200); tone('sine', 80, t, 0.05, 0.2, 0.8, null, 60); },
      shake: function (t) { for (var i = 0; i < 4; i++) { noise(t + i * 0.12, 0.05, 'bandpass', 700, 3, 0.15); } },

      rare: function (t) { FX.unlock(t); noise(t, 1.2, 'highpass', 7000, 0.5, 0.08); },
      meow: function (t) { var o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(), p = 0.9 + Math.random() * 0.25; o.type = 'sawtooth'; o.frequency.setValueAtTime(480 * p, t); o.frequency.linearRampToValueAtTime(820 * p, t + 0.16); o.frequency.exponentialRampToValueAtTime(430 * p, t + 0.55); f.type = 'bandpass'; f.Q.value = 2.2; f.frequency.setValueAtTime(800, t); f.frequency.linearRampToValueAtTime(1700, t + 0.18); f.frequency.linearRampToValueAtTime(900, t + 0.55); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.05); g.gain.setValueAtTime(0.22, t + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6); o.connect(f); f.connect(g); g.connect(mS); o.start(t); o.stop(t + 0.65); },
      thud: function (t) { tone('sine', 140, t, 0.003, 0.3, 0.18, null, 70); noise(t, 0.06, 'lowpass', 600, 0.7, 0.2); }
    };
    window.__sfx = function (n) { try { init(); if (!ac || !FX[n]) { return; } FX[n](ac.currentTime + 0.01); } catch (e) {} };
    window.__clay = function (a) { clayLvl += Math.min(0.08, a * 0.012); };
    var lastTap = 0;
    document.addEventListener('pointerdown', function (e) {
      init();
      var el = e.target && e.target.closest ? e.target.closest('button,a,[role=button],[onclick]') : null;
      if (el && !el.closest('[data-work]') && Date.now() - lastTap > 60) { lastTap = Date.now(); window.__sfx('tap'); }
    }, true);
    document.addEventListener('keydown', function () { init(); }, true);
    // 저장 데이터 변화로 공통 효과음 (골드 증가 · 옥 사용 · 튜토리얼 해금)
    var prev = load();
    setInterval(function () {
      upd();
      var g = load();
      if ((g.gold || 0) > (prev.gold || 0)) { window.__sfx('coin'); }
      if ((g.jade || 0) < (prev.jade || 0)) { window.__sfx('jade'); }
      if (typeof g.tut === 'number' && typeof prev.tut === 'number' && g.tut > prev.tut) { window.__sfx('unlock'); }
      prev = g;
    }, 300);
  }
  componentDidMount() {
    try { this.tutBoot(); } catch (e) {}
    try { this.sndBoot(); } catch (e) {}
    var self = this;
    this.onStore = function (e) { if (!e || e.key === 'pottery-proto-v1' || e.key === null) { self.setState({ g: self.loadG() }); } };

  trees(g) {

        N('물레 속도 제어', 'RES\nSPEED', false, ['저속 · 고속 선택', '고속 두께 소모 완화'], 80, '물레 성형 완료', 52, 50),

      ],

    };

  renderVals() {
    var self = this;
    var s = this.state;
    var list = this.trees(s.g)[s.tab];
    var extra = s.g.research || {};
    function isDone(i) { return list[i].done || !!extra[s.tab + i]; }

    var tabDefs = [{ id: 'tech', label: '기법' }, { id: 'glaze', label: '유약 · 소지' }, { id: 'shop', label: '공방' }];
    var tabs = tabDefs.map(function (d) {
      var on = d.id === s.tab;
      return {
        label: d.label, on: on,
        style: 'all:unset;cursor:pointer;box-sizing:border-box;text-align:center;padding:9px 0 7px;border:3px solid #5B3A24;border-radius:14px 14px 6px 6px;font-family:Jua,sans-serif;font-size:15px;' + (on ? 'background:#FFF4DE;box-shadow:0 3px 0 #3E2616;color:#5B3A24;' : 'background:#C9B08C;color:#4A2E1A;'),
        pick: function () { self.setState({ tab: d.id, sel: 2 }); }
      };
    });

    var pos = [{ l: 46, t: 18, z: 64 }, { l: 246, t: 18, z: 64 }, { l: 139, t: 102, z: 80 }, { l: 46, t: 206, z: 64 }, { l: 246, t: 206, z: 64 }];
    function status(i) {
      if (isDone(i)) { return 'done'; }
      var parentOk = i < 2 ? true : (i === 2 ? isDone(0) && isDone(1) : isDone(2));
      if (!parentOk) { return 'locked'; }
      return list[i].cur >= list[i].need ? 'ready' : 'wait';
    }

    var RIMG = {"RES\nWHEEL1": "_blob/631c128163d820378ae912cca30901ff.webp", "RES\nGLAZE1": "_blob/6acfa509bf46179df837b4ecb2e16813.webp", "RES\nCLAY1": "_blob/168a506af6c77c7a3c3b98739ba538cf.webp", "RES\nHAND": "_blob/caabb19b1476f844aa82f92043020bd9.webp", "RES\nSPEED": "_blob/7211a70afd5d86b8faf6ee5e8013a37b.webp", "RES\nTRIM": "_blob/72873242e46145e05edcc031f59286f8.webp", "RES\nTHIN": "_blob/e759cff558dc6740ec500654b5e97006.webp", "RES\nREDUCE": "_blob/36067ecc6631b260ba63b0d09fd6b8d7.webp", "RES\nMIX": "_blob/9e5d8a7f1f86979bc029f3a29cf0f28f.webp", "RES\nYOBYEON": "_blob/36bf2475355f28582d52209ca0752d6f.webp", "RES\nDRY": "_blob/440e5c6c074d35ced67a473fee4b4053.webp", "RES\nSHELF": "_blob/d655c0e16e17fab5b5f20461848b67e1.webp", "RES\nINSUL": "_blob/7fd660fe1c4dae49b58afde915b91d82.webp", "RES\nGUEST": "_blob/8c1100b4b356235661ebe13d71ba6eda.webp", "RES\nEXPAND": "_blob/b983f6fdb3eb5be57ee449d11bbc4f3f.webp"};
    var nodes = list.map(function (n, i) {
      var st = status(i);
      var p = pos[i];
      var selected = i === s.sel;
      var ringColor = { done: '#2F6328', ready: '#4A9440', wait: '#C8601E', locked: '#5E5547' }[st];
      var fill = st === 'locked' ? '#A89A84' : '#FFF4DE';
      var glow = selected ? ';box-shadow:0 0 0 4px rgba(255,214,107,.85),0 0 18px 4px rgba(255,190,90,.6)' : '';
      var inner = Math.round(p.z * 0.65);
      return {
        name: n.name, res: n.res, isDone: st === 'done', img: RIMG[n.res] || '', hasImg: !!RIMG[n.res], noImg: !RIMG[n.res],
        imgStyle: 'width:' + Math.round(p.z * 0.78) + 'px;height:' + Math.round(p.z * 0.78) + 'px;object-fit:contain;' + (st === 'locked' ? 'filter:grayscale(1) brightness(.75) opacity(.7)' : ''),
        wrap: 'all:unset;cursor:pointer;position:absolute;left:' + p.l + 'px;top:' + p.t + 'px;width:' + (p.z + 20) + 'px;margin-left:-10px;display:flex;flex-direction:column;align-items:center;gap:3px',
        ring: 'position:relative;width:' + p.z + 'px;height:' + p.z + 'px;box-sizing:border-box;border-radius:50%;background:' + fill + ';border:' + (i === 2 ? 5 : 4) + 'px solid ' + ringColor + ';display:flex;align-items:center;justify-content:center' + glow,
        inner: 'width:' + inner + 'px;height:' + inner + 'px;box-sizing:border-box;border:2px dashed ' + (st === 'locked' ? '#3E2E1E' : '#8A6440') + ';border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:5.5px;font-weight:900;color:#2B1A0F;text-align:center;line-height:1.1;white-space:pre-line',
        labelStyle: 'padding:0 7px;border-radius:6px;font-family:Jua,sans-serif;font-size:11px;white-space:nowrap;' + (selected ? 'background:#C8601E;color:#FFFDF5' : (st === 'locked' ? 'background:rgba(43,26,15,.65);color:#D8C6A6' : 'background:rgba(43,26,15,.8);color:#FFF4DE')),
        pick: function () { self.setState({ sel: i }); }
      };
    });

    var cur = list[s.sel];
    var st = status(s.sel);
    var pct = Math.min(100, Math.round(cur.cur / cur.need * 100));
    var enough = s.g.shards >= cur.cost;
    var btn = { done: '연구 완료', ready: enough ? '연구하기' : '파편이 모자라다', wait: '조건 ' + (cur.need - cur.cur) + '회 더 필요', locked: '선행 연구 필요' }[st];
    var active = st === 'ready' && enough;
    var btnStyle = 'all:unset;cursor:pointer;box-sizing:border-box;text-align:center;padding:11px 0;border-radius:16px;font-family:Jua,sans-serif;font-size:18px;' + (active ? 'background:#4A9440;border:3px solid #2F6328;box-shadow:0 4px 0 #2F6328;color:#FFFDF5;' : (st === 'done' ? 'background:#E1EFE4;border:3px solid #4E7D74;color:#2E4F48;' : 'background:#CFC5B4;border:3px solid #8E8473;color:#5E5547;'));

    var cDone = isDone(2);
    return {
      tabs: tabs,
      nodes: nodes,
      shards: s.g.shards,
      edge: { ab: '#2F6328', bc: (isDone(0) && isDone(1)) ? '#2F6328' : '#5E5547', cd: cDone ? '#2F6328' : '#5E5547', dash: cDone ? '0' : '2 10' },
      sel: {
        name: cur.name,
        effects: cur.effects.map(function (t) { return { t: t }; }),
        cost: cur.cost, cond: cur.cond, cur: Math.min(cur.cur, cur.need), need: cur.need,
        bar: 'width:' + pct + '%;height:100%;border-radius:6px;background:' + (pct >= 100 ? '#5FB052' : '#E3B23C') + ';box-shadow:inset 0 3px 0 rgba(255,255,255,.35)',
        btn: btn, btnStyle: btnStyle
      },
      doResearch: function () {
        if (st === 'done') { self.say('이미 끝낸 연구다'); return; }
        if (st === 'locked') { self.say('앞선 연구를 먼저 마쳐야 한다'); return; }
        if (st === 'wait') { self.say(cur.cond + ' ' + (cur.need - cur.cur) + '회가 더 필요하다. 파편만으로는 열리지 않는다'); return; }
        if (!enough) { self.say('파편이 ' + (cur.cost - s.g.shards) + ' 모자라다'); return; }
        var d = {}; for (var k in extra) { d[k] = extra[k]; }
        d[s.tab + s.sel] = true;
        self.setG({ research: d, shards: s.g.shards - cur.cost });
        self.say('「' + cur.name + '」 연구 완료');

      toast: s.toast,
      toastOn: s.toast !== ''
    };
