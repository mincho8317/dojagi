  potOf(it, fill) {

    var all = [];
    function add(list, o) { list.forEach(function (it) { var r = o(it); r.it = it; all.push(r); }); }
    var fresh = []; (g.order || []).forEach(function (id) { var p = (g.pieces || {})[id]; if (p && p.where === 'store' && p.fresh) { fresh.push(p); } });
    add(fresh, function () { return { rank: 8, tag: '완성', tone: 'ready', href: 'Display.dc.html', fill: 'glazed', next: '진열·판매' }; });
    add(batch, function (x) { var kl = g.kilnStart ? Math.max(0, Math.ceil((g.kilnStart + (g.kilnDur || 28800000) - now) / 1000)) : 0; return { rank: 7, tag: kl ? '재벌 ' + (kl >= 3600 ? Math.floor(kl / 3600) + '시간 ' + Math.floor(kl % 3600 / 60) + '분' : Math.ceil(kl / 60) + '분') : '재벌 완료', tone: kl ? 'busy' : 'ready', href: 'KilnOpen.dc.html', fill: 'glazed', next: kl ? '굽는 중' : '꺼내기' }; });
    add(placed, function () { return { rank: 6, tag: '가마 칸에', tone: 'ready', href: firingK ? 'KilnOpen.dc.html' : 'Kiln.dc.html', fill: 'glazed', next: '불 지피기' }; });
    add(g.kilnList || [], function () { return { rank: 5, tag: '재벌 대기', tone: 'ready', href: firingK ? 'KilnOpen.dc.html' : 'Kiln.dc.html', fill: 'glazed', next: '가마에 넣기' }; });
    add(g.glazeList || [], function () { return { rank: 4, tag: '유약 대기', tone: 'ready', href: 'Glaze.dc.html', fill: 'bisque', next: '유약 바르기' }; });
    add(firingB ? (bq.items || []) : [], function () { return { rank: 3, tag: bqLeft ? '초벌 ' + (bqLeft >= 60 ? Math.ceil(bqLeft / 60) + '분' : bqLeft + '초') : '초벌 완료', tone: bqLeft ? 'busy' : 'ready', href: 'Bisque.dc.html', fill: 'bisque', next: bqLeft ? '초벌 중' : '꺼내기' }; });
    add(g.bisqueList || [], function (x) { return { rank: 2, tag: x.dry === 'early' ? '반건조' : '초벌 대기', tone: x.dry === 'early' ? 'warn' : 'ready', href: 'Bisque.dc.html', fill: 'dry', next: '초벌 가마에 넣기' }; });
    add(g.dryList || [], function (x) { var p = Math.round((now - x.start) / 18000); return { rank: 1, tag: '건조 ' + p + '%', tone: p >= 100 && p <= 120 ? 'ready' : (p > 120 ? 'warn' : 'busy'), href: 'Dry.dc.html', fill: p >= 100 ? 'dry' : 'wet', next: '건조대 확인' }; });
    add(g.formedList || [], function () { return { rank: 0, tag: '건조 대기', tone: 'ready', href: 'Dry.dc.html', fill: 'wet', next: '건조대에 올리기' }; });
    all.sort(function (a, b) { return b.rank - a.rank; });
    var slots = all.map(function (r, i) {
      var t = TONE[r.tone], it = r.it;
      var name = (it.glaze && r.rank >= 5 ? (GN[it.glaze] || '') + ' ' : '') + (SN[it.shape] || it.shape || '');
      return {
        filled: true, empty: false, num: i + 1, name: it.name || name, tag: r.tag, href: r.href,
        aria: (i + 1) + '번 ' + name + ' · ' + r.tag + ' · ' + r.next,
        pot: self.potOf(it, self.fillOf(it, r.fill)),
        go: function () { if (it.id) { self.setFocus(it.id); } },
        style: 'position:relative;height:128px;margin-bottom:14px;box-sizing:border-box;padding-top:30px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;text-decoration:none;border-radius:10px;',
        tagStyle: 'position:absolute;left:0;right:0;top:0;margin:0 auto;width:max-content;max-width:100%;box-sizing:border-box;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 6px;border-radius:9px;font-family:Jua,sans-serif;font-size:10.5px;background:' + t[0] + ';color:' + t[1] + ';border:2px solid ' + t[2] + ';' + (r.tone === 'ready' ? 'box-shadow:0 0 8px rgba(255,230,140,.85);animation:readyPulse 1.6s ease-in-out infinite;' : ''),
        numStyle: 'position:absolute;left:2px;top:26px;min-width:18px;height:18px;box-sizing:border-box;padding:0 4px;border-radius:9px;background:#2B1A0F;border:1.5px solid #E8D3B5;color:#FFE7A8;font-family:Jua,sans-serif;font-size:10.5px;display:flex;align-items:center;justify-content:center'
      };
    });
    var tiers = [];
    var nT = Math.max(3, Math.ceil(slots.length / 4));
    for (var t2 = 0; t2 < nT; t2++) {
      var row = slots.slice(t2 * 4, t2 * 4 + 4);
      while (row.length < 4) { row.push({ filled: false, empty: true }); }
      tiers.push({ slots: row });
    }
    var cnt = [0, 0, 0, 0, 0, 0, 0, 0, 0];
    all.forEach(function (r) { cnt[r.rank]++; });
    var LG = [['건조 대기', 0], ['건조 중', 1], ['초벌 대기', 2], ['초벌 중', 3], ['유약 대기', 4], ['재벌 대기', 5], ['가마 칸', 6], ['재벌 중', 7], ['완성', 8]];
    return {
      goDone: function () { try { var gg = JSON.parse(localStorage.getItem('pottery-proto-v1') || '{}'); gg.commTab = 'done'; localStorage.setItem('pottery-proto-v1', JSON.stringify(gg)); } catch (e) {} },
      total: all.length, empty: all.length === 0,
      tiers: all.length ? tiers : [],
      legend: LG.filter(function (l) { return cnt[l[1]] > 0; }).map(function (l) { return { text: l[0] + ' ' + cnt[l[1]], style: 'flex:0 0 auto;white-space:nowrap;padding:2px 9px;border-radius:9px;background:#FFF4DE;border:2px solid #8A6440;font-family:Jua,sans-serif;font-size:12px;color:#5B3A24' }; })
    };
  }
}
