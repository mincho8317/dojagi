<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2B1A0F">
<title>그래픽 리소스 목록</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif}
a{color:#5B3A24}a:hover{color:#3E2616}
</style>
</helmet>
<div style="width:1330px;height:2880px;box-sizing:border-box;padding:48px 56px;background:#FFF4DE;color:#2B1A0F;display:flex;flex-direction:column;gap:28px">

  <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px">
    <div style="display:flex;flex-direction:column;gap:8px">
      <h1 style="margin:0;font-family:'Jua',sans-serif;font-size:40px;font-weight:400;color:#5B3A24">그래픽 리소스 목록</h1>
      <p style="margin:0;font-size:14px;color:#7A5434">목업의 점선 박스와 1:1로 대응. 크기는 1080×2340 기준 @3x 권장값이며, 투명 PNG(배경 제외)로 제작.</p>
    </div>
    <div style="display:flex;gap:10px">
      <span style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;border:2px dashed #8A6440;font-size:13px;color:#5B3A24">점선 = 리소스 자리</span>
      <span style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:12px;background:#5B3A24;font-size:13px;font-weight:700;color:#FFE7A8">총 {{total}}종</span>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px;flex:1 1 auto;min-height:0">
    <sc-for list="{{columns}}" as="col" hint-placeholder-count="2">
      <div style="display:flex;flex-direction:column;gap:22px">
        <sc-for list="{{col.groups}}" as="g" hint-placeholder-count="3">
          <section style="display:flex;flex-direction:column;gap:6px">
            <div style="display:flex;align-items:baseline;gap:10px;padding-bottom:6px;border-bottom:3px solid #5B3A24">
              <h2 style="margin:0;font-family:'Jua',sans-serif;font-size:20px;font-weight:400;color:#B9533A">{{g.title}}</h2>
              <span style="font-size:12px;color:#7A5434">{{g.note}}</span>
            </div>
            <div style="display:grid;grid-template-columns:200px 1fr 120px 150px;gap:0;font-size:11px;font-weight:900;color:#8A6440;padding:2px 0 4px">
              <span>ID</span><span>용도</span><span>권장 크기</span><span>사용 화면</span>
            </div>
            <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="5">
              <div style="display:grid;grid-template-columns:200px 1fr 120px 150px;gap:0;align-items:center;padding:4px 0;border-bottom:1px solid #EAD8B6;font-size:12.5px">
                <span style="font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:700;color:#2B1A0F">{{r.id}}</span>
                <span style="color:#3E2616">{{r.use}}</span>
                <span style="color:#5B3A24">{{r.size}}</span>
                <span style="color:#7A5434">{{r.where}}</span>
              </div>
            </sc-for>
          </section>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

</body>
</html>
