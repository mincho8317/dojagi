            <span style="width:100%;height:96px;box-sizing:border-box;border-radius:12px;background:#F3E3C4;display:flex;align-items:center;justify-content:center;padding:6px"><img dc-src="{{d.img}}" alt="" aria-hidden="true" style="width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 3px 2px rgba(43,26,15,.3))"></span>
            <span style="font-family:'Jua',sans-serif;font-size:15px;color:#2B1A0F">{{d.name}}</span>

            <button type="button" onClick="{{d.buy}}" style="{{d.style}}">{{d.label}}</button>

  </sc-if>

  <nav aria-label="주 메뉴" style="position:absolute;left:0;bottom:0;width:390px;height:92px;box-sizing:border-box;padding:0 6px 8px;background:#6B4429;border-top:4px solid #3E2616;box-shadow:inset 0 3px 0 #8A5A36;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end">
    <a href="Main.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;text-decoration:none">
      <img src="_blob/4d235f31faacd07e94182c72c545cfea.webp" alt="" aria-hidden="true" style="width:40px;height:40px;object-fit:contain">
      <span style="font-family:'Jua',sans-serif;font-size:12px;white-space:nowrap;color:#F6E7CC">공방</span>
    </a>
    <a href="Contest.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;text-decoration:none">
      <img src="_blob/6949a543d34c10b07085e1ed58155f45.webp" alt="" aria-hidden="true" style="width:40px;height:40px;object-fit:contain">
      <span style="font-family:'Jua',sans-serif;font-size:12px;white-space:nowrap;color:#F6E7CC">스테이지</span>
    </a>
    <a href="Wheel.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;margin-top:-28px">
      <span style="width:70px;height:70px;box-sizing:border-box;border-radius:50%;background:#4A9440;border:4px solid #2F6328;box-shadow:0 4px 0 #2F6328,inset 0 3px 0 #6DB35E;display:flex;align-items:center;justify-content:center">
        <img src="_blob/57df2cdf4d037636e8c5fa366b12ec35.webp" alt="" aria-hidden="true" style="width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))">
      </span>
      <span style="font-family:'Jua',sans-serif;font-size:13px;color:#F6E7CC">제작</span>
    </a>
    <a href="Commission.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;text-decoration:none">
      <img src="_blob/e3f790ef5b7c6af4d706b063f909ab46.webp" alt="" aria-hidden="true" style="width:40px;height:40px;object-fit:contain">
      <span style="font-family:'Jua',sans-serif;font-size:12px;white-space:nowrap;color:#F6E7CC">의뢰</span>
    </a>
    <a href="Shop.dc.html" aria-current="page" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;background:rgba(255,214,107,.2);text-decoration:none">
      <img src="_blob/06f86a4df741dc544193607cfb80c2fb.webp" alt="" aria-hidden="true" style="width:40px;height:40px;object-fit:contain">
      <span style="font-family:'Jua',sans-serif;font-size:12px;white-space:nowrap;color:#FFD66B">상점</span>
    </a>
  </nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'fac', toast: '', g: this.loadG() };
  }
  gdef() {
    return {
      gold: 1240, shards: 142, fameLv: 3, fameXp: 62,
      drying: 1, glazeQ: 2, kilnQ: 0,
      kiln: 'firing', heat: 'mid', kilnFilled: { '0': true, '1': true, '4': true }, firings: 38,
      openIdx: 0, openLog: [],
      trim: false, mats: {}, deco: {},
      quests: { min: false, guest: false, week: false, minDone: false },
      research: {},
      pieces: {
        p1: { name: '청자 찻잔', grade: '수작', shape: 'cup', glaze: 'celadon', where: 'shelf', value: 10900 },
        p2: { name: '백자 달항아리', grade: '명작', shape: 'jar', glaze: 'white', where: 'shelf', value: 24000 },
        p3: { name: '분청 사발', grade: '양작', shape: 'bowl', glaze: 'white', where: 'shelf', value: 3200 },
        p4: { name: '청자 잔', grade: '양작', shape: 'cup', glaze: 'celadon', where: 'shelf', value: 2600 }
      },
      order: ['p1', 'p2', 'p3', 'p4'],
      broken: 0, curator: 'waiting',
      glazesFound: { white: true, celadon: true, black: true },
      shapesFound: { dish: true, cup: true, bowl: true, jar: true }
    };
  }
  loadG() {
    var d = this.gdef();
    try { var r = localStorage.getItem('pottery-proto-v1'); if (r) { var o = JSON.parse(r); for (var k in o) { d[k] = o[k]; } } } catch (e) {}
    return d;
  }
  setG(p) {
    var c = this.state.g, g = {};
    for (var k in c) { g[k] = c[k]; }
    for (var j in p) { g[j] = p[j]; }
    try { localStorage.setItem('pottery-proto-v1', JSON.stringify(g)); } catch (e) {}
    this.setState({ g: g });
  }
  tutBoot() {
    var PAGE = 'Shop';
    if (typeof window === 'undefined' || typeof document === 'undefined') { return; }
    if (window.__tutBooted) { return; }
    window.__tutBooted = true;
    var KEY = 'pottery-proto-v1';
    var NAMES = { Dry: '건조대', Queue: '작업 대기함', Bisque: '초벌 가마', Glaze: '유약 바르기', Kiln: '가마 소성', KilnOpen: '가마 열기', Display: '진열대·판매', Counter: '카운터 손님', Commission: '의뢰 장부', Shop: '상점', Contest: '스테이지', Research: '연구', Codex: '도감', Season: '봄 축제', Town: '마을' };
    var UNL = [['Dry', 'Queue'], ['Bisque'], ['Glaze'], ['Kiln', 'KilnOpen'], ['Display'], ['Counter', 'Commission'], ['Shop', 'Contest'], ['Research', 'Codex', 'Season', 'Town']];
    var STEPS = [
      { goal: '물레에서 첫 그릇 빚기', hint: '공방의 물레(또는 아래 제작 버튼)를 눌러 흙을 빚어 보세요', next: 'Wheel' },
      { goal: '건조대에서 말리고 꺼내기', hint: '빚은 그릇을 건조대에 올리고, 완전 건조가 되면 빼 주세요', next: 'Dry' },
      { goal: '초벌 가마에 굽기', hint: '마른 그릇을 초벌 가마에 넣고, 다 구워지면 꺼내 주세요', next: 'Bisque' },
      { goal: '유약 바르기', hint: '초벌한 그릇을 유약통에 꾹 눌러 담가 보세요', next: 'Glaze' },
      { goal: '가마에서 굽고 꺼내기', hint: '유약 바른 그릇을 가마에 넣고 불을 지핀 뒤 꺼내 보세요', next: 'Kiln' },
      { goal: '진열대에 작품 올리기', hint: '보관함의 작품을 진열대로 끌어 올려 보세요', next: 'Display' },
      { goal: '손님에게 팔거나 의뢰 받기', hint: '카운터에서 손님을 맞이해 보세요', next: 'Counter' },
      { goal: '스테이지에서 첫 별 얻기', hint: '스테이지에서 조건에 맞는 작품을 출품해 보세요', next: 'Contest' }
    ];
    function load() { try { return JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) { return {}; } }
    function save(g) { try { localStorage.setItem(KEY, JSON.stringify(g)); } catch (e) {} }
    function len(a) { return (a && a.length) || 0; }
    function cnt(o) { var n = 0; for (var k in (o || {})) { if (o[k]) { n++; } } return n; }
    function pieceN(g, w) { var n = 0, ps = g.pieces || {}; for (var k in ps) { if (ps[k] && (!w || w.indexOf(ps[k].where) >= 0)) { n++; } } return n; }
    function lv(g) {
      var made = pieceN(g) > 0;
      var kilnIn = len(g.kilnList) || cnt(g.kilnFilled) || g.kiln === 'firing' || made;
      var glazed = len(g.glazeList) || kilnIn;
      var bisq = len(g.bisqueList) || len((g.bisque || {}).items) || glazed;
      var formed = len(g.formedList) || len(g.dryList) || bisq;
      var shown = pieceN(g, ['shelf', 'sold', 'museum']) > 0;
      var sold = pieceN(g, ['sold']) > 0 || !!(g.quests || {}).min;
      var star = cnt(((g.contest || {}).stars) || {}) > 0;
      return [formed, bisq, glazed, kilnIn, made, shown, sold, star];
    }
    function locked(g) {
      var t = g.tut, L = {};
      if (typeof t !== 'number' || t >= UNL.length) { return L; }
      for (var i = t; i < UNL.length; i++) { UNL[i].forEach(function (p) { L[p] = true; }); }
      return L;
    }
    function pageOf(href) { var m = /([A-Za-z]+)\.dc\.html/.exec(href || ''); return m ? m[1] : ''; }
    var css = document.createElement('style');
    var sel = Object.keys(NAMES).map(function (p) { return 'html[data-tl~="' + p + '"] a[href*="' + p + '.dc.html"]'; });
    css.textContent = sel.join(',') + '{filter:grayscale(1) brightness(.8)!important;opacity:.45!important}' +
      Object.keys(NAMES).concat(['Wheel']).map(function (p) { return 'html[data-tn="' + p + '"] a[href="' + p + '.dc.html"]'; }).join(',') + '{animation:tutPulse 1.2s ease-in-out infinite!important;border-radius:14px}' +
      '@keyframes tutPulse{0%,100%{box-shadow:0 0 0 3px rgba(255,214,107,.9),0 0 10px 2px rgba(255,214,107,.7)}50%{box-shadow:0 0 0 5px rgba(255,214,107,.5),0 0 24px 8px rgba(255,214,107,.9)}}' +
      '@keyframes tutIn{0%{transform:translate(-50%,-14px);opacity:0}100%{transform:translate(-50%,0);opacity:1}}@keyframes tutPop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}' +
      '.tut-card{position:fixed;left:50%;top:12px;z-index:9998;width:min(352px,92vw);box-sizing:border-box;padding:9px 12px;border-radius:16px;background:rgba(43,26,15,.94);border:3px solid #FFD66B;box-shadow:0 6px 16px rgba(0,0,0,.4);color:#FFF4DE;font-family:Jua,sans-serif;pointer-events:none;animation:tutIn .35s ease-out both;transition:opacity .4s}' +

      '.tut-toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:9999;width:min(320px,86vw);box-sizing:border-box;padding:11px 14px;border-radius:16px;background:rgba(43,26,15,.95);border:3px solid #FFE7A8;font-family:Jua,sans-serif;font-size:14px;line-height:1.45;color:#FFF4DE;text-align:center;pointer-events:none}';
    document.head.appendChild(css);
    var cardEl = null, cardT = 0, toastT = 0;

      var box = document.createElement('div'); box.className = 'tut-box'; box.setAttribute('role', 'dialog'); box.innerHTML = html;
      btns.forEach(function (b) { var bt = document.createElement('button'); bt.type = 'button'; bt.className = 'tut-btn ' + (b.cls || 'go'); bt.textContent = b.label; bt.addEventListener('click', function () { ov.remove(); if (b.run) { b.run(); } }); box.appendChild(bt); });
      ov.appendChild(box); document.body.appendChild(ov); return ov;
    }
    function showCard(g, sticky) {
      var t = g.tut; if (typeof t !== 'number' || t >= STEPS.length) { if (cardEl) { cardEl.remove(); cardEl = null; } return; }
      var st = STEPS[t];

      cardEl.innerHTML = '<b>🎯 ' + (t + 1) + '/' + STEPS.length + ' · ' + st.goal + '</b><span>' + st.hint + '</span>';
      cardEl.style.opacity = '1'; cardEl.style.top = sticky ? '74px' : '12px';
      clearTimeout(cardT);
      if (!sticky) { cardT = setTimeout(function () { if (cardEl) { cardEl.style.opacity = '0'; } }, 4500); }
    }
    function apply(g) {
      var L = locked(g), keys = Object.keys(L);
      document.documentElement.setAttribute('data-tl', keys.join(' '));
      var t = g.tut;
      document.documentElement.setAttribute('data-tn', typeof t === 'number' && t < STEPS.length ? STEPS[t].next : '');
      return L;
    }
    function freshStart(keep) {
      var g = { tut: 0, jade: 5000, gold: 800, shards: 0, fameLv: 1, fameXp: 0, formedList: [], dryList: [], bisqueList: [], bisque: { state: 'idle', start: 0, items: [] }, glazeList: [], kilnList: [], kiln: 'empty', heat: 'mid', kilnFilled: {}, batchItems: [], batch: 0, kilnStart: 0, firings: 0, openIdx: 0, openLog: [], trim: false, mats: {}, deco: {}, quests: { min: false, guest: false, week: false, minDone: false }, research: {}, pieces: {}, order: [], broken: 0, curator: 'done', walkins: [], tasteOrders: [], tasteDone: [], contest: { stars: {} }, goal: null, glazesFound: { white: true, celadon: true, black: true }, shapesFound: { dish: true, cup: true, bowl: true }, soldBy: {}, soldDay: 0 };
      ['settings', 'feedbacks', 'playerName', 'layout'].forEach(function (k) { if (keep[k] !== undefined) { g[k] = keep[k]; } });
      save(g); return g;

    function check(first) {

          window.dispatchEvent(new Event('storage'));
        }
      }
      var L = apply(load());
      if (first && L[PAGE]) {
        overlay('<div class="ic">🔒</div><h3>아직 잠겨 있어요</h3><p>' + (NAMES[PAGE] || '이 화면') + '은(는) 튜토리얼을 진행하면 열려요.\n지금 목표: ' + STEPS[load().tut].goal + '</p>', [{ label: '공방으로', run: function () { location.href = 'Main.dc.html'; } }]);
      }

        { label: '튜토리얼 시작', run: function () { freshStart(load()); try { location.reload(); } catch (e) {} } },
        { label: '건너뛰고 모든 기능 열기', cls: 'sub', run: function () { var g = load(); g.tut = 99; save(g); apply(g); } }
      ]);
    } else {
      check(true);
      showCard(load(), PAGE === 'Main');
    }
    setInterval(function () { check(false); }, 1000);
  }
  componentDidMount() {
    try { this.tutBoot(); } catch (e) {}
    var self = this;
    this.onStore = function (e) { if (!e || e.key === 'pottery-proto-v1' || e.key === null) { self.setState({ g: self.loadG() }); } };
    try { window.addEventListener('storage', this.onStore); } catch (e) {}
  }
  componentWillUnmount() {
    clearTimeout(this.tt);
    try { window.removeEventListener('storage', this.onStore); } catch (e) {}
  }
  say(msg) {
    var self = this;
    clearTimeout(this.tt);
    this.setState({ toast: msg });
    this.tt = setTimeout(function () { self.setState({ toast: '' }); }, 1800);
  }
  spend(cost, ok, extra) {
    var g = this.state.g;
    if (g.gold < cost) { this.say('골드가 ' + (cost - g.gold).toLocaleString() + ' 모자라다'); return false; }
    var patch = { gold: g.gold - cost };
    for (var k in (extra || {})) { patch[k] = extra[k]; }
    this.setG(patch);
    if (ok) { this.say(ok); }
    return true;
  }
  renderVals() {
    var self = this;

        pick: function () { self.setState({ tab: d.id }); }

    var matDefs = [
      { id: 'refined', img: '_blob/1e4f725f95d17eb94906709e0a47a9b5.webp', res: 'CLAY\nREFINED', name: '정제 점토', desc: '품질 ×1.0', price: 80 },
      { id: 'kaolin', img: '_blob/c9da99f472ceecfded0ba9a0a549270d.webp', res: 'CLAY\nKAOLIN', name: '고령토', desc: '품질 ×1.25', price: 220 },
      { id: 'porcelain', img: '_blob/c0deb6a91697eacf64b9a494efa9dabd.webp', res: 'CLAY\nPORCELAIN', name: '자기토', desc: '품질 ×1.4 · 고화도 전용', price: 400 },

      { id: 'plaster', img: '_blob/c2b64043b840ab3539af5fd284ab04aa.webp', res: 'MAT\nPLASTER', name: '석고', desc: '몰드 1개 제작용', price: 1200 },
      { id: 'jinsa', img: '_blob/34ce3b19abfe3f12b26566e73ea9d191.webp', res: 'GLZ\nJINSA', name: '진사유', desc: '유약 1회분 · 유약 화면에서 사용', price: 450 }

    var decoDefs = [

      { id: 'rug', img: '_blob/f857ae2f300bc085e71fa4e003350137.webp', res: 'DECO_RUG', size: '360×180', name: '무명 러그', effect: '방문객 등급 +1%', price: 1100 },

    var decos = decoDefs.map(function (d) {

        style: 'all:unset;cursor:pointer;box-sizing:border-box;width:100%;text-align:center;padding:7px 0;border-radius:12px;font-family:Jua,sans-serif;font-size:15px;' + (owned ? 'background:#CFC5B4;border:3px solid #8E8473;color:#5E5547;' : 'background:#4A9440;border:3px solid #2F6328;box-shadow:0 3px 0 #2F6328;color:#FFFDF5;'),

    return {

      goldText: G.gold.toLocaleString(),
