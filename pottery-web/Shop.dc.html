      meow: function (t) { var o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain(), p = 0.9 + Math.random() * 0.25; o.type = 'sawtooth'; o.frequency.setValueAtTime(480 * p, t); o.frequency.linearRampToValueAtTime(820 * p, t + 0.16); o.frequency.exponentialRampToValueAtTime(430 * p, t + 0.55); f.type = 'bandpass'; f.Q.value = 2.2; f.frequency.setValueAtTime(800, t); f.frequency.linearRampToValueAtTime(1700, t + 0.18); f.frequency.linearRampToValueAtTime(900, t + 0.55); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.05); g.gain.setValueAtTime(0.22, t + 0.3); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6); o.connect(f); f.connect(g); g.connect(mS); o.start(t); o.stop(t + 0.65); },
      thud: function (t) { tone('sine', 140, t, 0.003, 0.3, 0.18, null, 70); noise(t, 0.06, 'lowpass', 600, 0.7, 0.2); }
    };
    window.__sfx = function (n) { try { init(); if (!ac || !FX[n]) { return; } FX[n](ac.currentTime + 0.01); } catch (e) {} };
    window.__clay = function (a) { clayLvl += Math.min(0.08, a * 0.012); };
    var lastTap = 0;
    document.addEventListener('pointerdown', function (e) {
      init();
      var el = e.target && e.target.closest ? e.target.closest('button,a,[role=button],[onclick]') : null;
      if (el && !el.closest('[data-work]') && Date.now() - lastTap > 60) { lastTap = Date.now(); window.__sfx('tap'); }
    }, true);
    document.addEventListener('keydown', function () { init(); }, true);
    // 저장 데이터 변화로 공통 효과음 (골드 증가 · 옥 사용 · 튜토리얼 해금)
    var prev = load();
    setInterval(function () {
      upd();
      var g = load();
      if ((g.gold || 0) > (prev.gold || 0)) { window.__sfx('coin'); }
      if ((g.jade || 0) < (prev.jade || 0)) { window.__sfx('jade'); }
      if (typeof g.tut === 'number' && typeof prev.tut === 'number' && g.tut > prev.tut) { window.__sfx('unlock'); }
      prev = g;
    }, 300);
  }
  componentDidMount() {
    try { this.tutBoot(); } catch (e) {}
    try { this.sndBoot(); } catch (e) {}
    var self = this;
    this.onStore = function (e) { if (!e || e.key === 'pottery-proto-v1' || e.key === null) { self.setState({ g: self.loadG() }); } };
    try { window.addEventListener('storage', this.onStore); } catch (e) {}
  }
  componentWillUnmount() {
    clearTimeout(this.tt);
    try { window.removeEventListener('storage', this.onStore); } catch (e) {}
  }
  say(msg) {
    var self = this;
    clearTimeout(this.tt);
    this.setState({ toast: msg });
    this.tt = setTimeout(function () { self.setState({ toast: '' }); }, 1800);
  }
  spend(cost, ok, extra) {
    var g = this.state.g;
    if (g.gold < cost) { this.say('골드가 ' + (cost - g.gold).toLocaleString() + ' 모자라다'); return false; }
    var patch = { gold: g.gold - cost };
    for (var k in (extra || {})) { patch[k] = extra[k]; }
    this.setG(patch);
    if (ok) { this.say(ok); }
    return true;
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var G = s.g;
    var tabDefs = [{ id: 'mat', label: '재료' }, { id: 'fac', label: '설비' }, { id: 'deco', label: '꾸미기' }];
    var tabs = tabDefs.map(function (d) {
      var on = d.id === s.tab;
      return {
        label: d.label, on: on,
        style: 'all:unset;cursor:pointer;box-sizing:border-box;text-align:center;padding:9px 0 7px;border:3px solid #5B3A24;border-radius:14px 14px 6px 6px;font-family:Jua,sans-serif;font-size:15px;' + (on ? 'background:#FFF4DE;box-shadow:0 3px 0 #3E2616;color:#5B3A24;' : 'background:#C9B08C;color:#4A2E1A;'),
        pick: function () { self.setState({ tab: d.id }); }
      };
    });

    var matDefs = [
      { id: 'refined', img: '_blob/1e4f725f95d17eb94906709e0a47a9b5.webp', res: 'CLAY\nREFINED', name: '정제 점토', desc: '품질 ×1.0', price: 80 },
      { id: 'kaolin', img: '_blob/c9da99f472ceecfded0ba9a0a549270d.webp', res: 'CLAY\nKAOLIN', name: '고령토', desc: '품질 ×1.25', price: 220 },
      { id: 'porcelain', img: '_blob/c0deb6a91697eacf64b9a494efa9dabd.webp', res: 'CLAY\nPORCELAIN', name: '자기토', desc: '품질 ×1.4 · 고화도 전용', price: 400 },
      { id: 'premium', img: '_blob/79f22235a775734d2bfb0397256165e3.webp', res: 'CLAY\nPREMIUM', name: '특선 소지', desc: '품질 ×1.5 · 박태 2.0mm까지', price: 900 },
      { id: 'plaster', img: '_blob/c2b64043b840ab3539af5fd284ab04aa.webp', res: 'MAT\nPLASTER', name: '석고', desc: '몰드 1개 제작용', price: 1200 },
      { id: 'jinsa', img: '_blob/34ce3b19abfe3f12b26566e73ea9d191.webp', res: 'GLZ\nJINSA', name: '진사유', desc: '유약 1회분 · 유약 화면에서 사용', price: 450 }
    ];
    var mats = matDefs.map(function (m) {
      return {
        res: m.res, img: m.img, name: m.name, desc: m.desc, price: m.price.toLocaleString(),
        own: (G.mats || {})[m.id] || 0,
        buy: function () {
          var o = {}; for (var k in G.mats) { o[k] = G.mats[k]; }
          o[m.id] = (o[m.id] || 0) + 1;
          self.spend(m.price, m.name + '을(를) 샀다', { mats: o });
        }
      };
    });

    var decoDefs = [
      { id: 'lamp', img: '_blob/e70f56a19bd79329b1c338c1f0da7ebd.webp', res: 'DECO_LAMP', size: '240×240', name: '한지 등', effect: '방문 빈도 +2%', price: 600 },
      { id: 'plant', img: '_blob/276078c4d372d3dd5ca8fc4961584043.webp', res: 'DECO_PLANT', size: '240×240', name: '화분', effect: '명성 +1/시간', price: 900 },
      { id: 'rug', img: '_blob/f857ae2f300bc085e71fa4e003350137.webp', res: 'DECO_RUG', size: '360×180', name: '무명 러그', effect: '방문객 등급 +1%', price: 1100 },
      { id: 'sign', img: '_blob/e9eab19c044e9273c9fb16c7d6ee488d.webp', res: 'DECO_SIGN', size: '300×150', name: '나무 간판', effect: '명성 +2/시간', price: 2400 }
    ];
    var decos = decoDefs.map(function (d) {
      var owned = !!(G.deco || {})[d.id];
      return {
        res: d.res, img: d.img, size: d.size, name: d.name, effect: d.effect,
        label: owned ? '배치됨' : d.price.toLocaleString(),
        style: 'all:unset;cursor:pointer;box-sizing:border-box;width:100%;text-align:center;padding:7px 0;border-radius:12px;font-family:Jua,sans-serif;font-size:15px;' + (owned ? 'background:#CFC5B4;border:3px solid #8E8473;color:#5E5547;' : 'background:#4A9440;border:3px solid #2F6328;box-shadow:0 3px 0 #2F6328;color:#FFFDF5;'),
        buy: function () {
          if (owned) { self.say('이미 공방에 놓여 있다'); return; }
          var o = {}; for (var k in G.deco) { o[k] = G.deco[k]; }
          o[d.id] = true;
          self.spend(d.price, d.name + '을(를) 공방에 놓았다', { deco: o });
        }
      };
    });

    var trimBuy = 'all:unset;cursor:pointer;box-sizing:border-box;margin-top:auto;width:100%;text-align:center;padding:8px 0;background:#4A9440;border:3px solid #2F6328;box-shadow:0 3px 0 #2F6328;border-radius:13px;font-family:Jua,sans-serif;font-size:17px;color:#FFFDF5;';
    var trimOwned = 'all:unset;cursor:pointer;box-sizing:border-box;margin-top:auto;width:100%;text-align:center;padding:8px 0;background:#CFC5B4;border:3px solid #8E8473;border-radius:13px;font-family:Jua,sans-serif;font-size:16px;color:#5E5547;';

    return {
      tabs: tabs,
      isFac: s.tab === 'fac',
      isMat: s.tab === 'mat',
      isDeco: s.tab === 'deco',
      goldText: G.gold.toLocaleString(),
      mats: mats,
      decos: decos,
      trimLabel: G.trim ? '보유 중' : '800',
      trimStyle: G.trim ? trimOwned : trimBuy,
      buyTrim: function () {
        if (G.trim) { self.say('공방에 설치되어 있다'); return; }
        self.spend(800, '굽깎이대를 들였다 · 2차 성형 해금', { trim: true });
      },
      tryBrush: function () {
        if (G.brush) { self.say('공방에 설치되어 있다'); return; }
        if (G.fameLv < 4) { self.say('명성 Lv.4가 되면 살 수 있다 · 현재 Lv.' + G.fameLv); return; }
        self.spend(2000, '붓 · 시유대를 들였다 · 붓칠 해금', { brush: true });
      },
      tryElec: function () {
        if (G.gold < 12000) { self.say('골드가 ' + (12000 - G.gold).toLocaleString() + ' 모자라다'); return; }
        self.say('명성 Lv.3 충족 · 구매 흐름은 다음 목업에서 추가 예정');
      },
      brushReq: G.fameLv >= 4 ? '명성 Lv.4 충족' : '명성 Lv.4 필요',
      brushLabel: G.brush ? '보유 중' : '2,000',
      toast: s.toast,
      toastOn: s.toast !== ''
    };
  }
}
</script>
