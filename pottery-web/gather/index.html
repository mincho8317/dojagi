<meta charset="utf-8">
<title>공방 채집터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
/* 한 화면 탑뷰 채집터 · 캔버스 게임 + HTML 오버레이 (단일 톤) */
:root{
  --ink:#1C1410; --mud:#5B3A24; --paper:#FFF4DE; --clay:#B9533A; --gold:#FFD66B; --leaf:#6F8F4E; --stone:#7D776F;
  --f-disp:'Jua','Apple SD Gothic Neo',sans-serif; --f-body:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--ink);color:var(--paper);font-family:var(--f-body);overflow:hidden}
#wrap{position:relative;height:100%;max-width:460px;margin:0 auto;background:#3E2C1E;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:rgba(28,20,16,.72);z-index:5}
.ov[hidden]{display:none}
.card{width:100%;max-width:370px;max-height:100%;overflow:auto;box-sizing:border-box;padding:4px 2px 2px;color:#2B1A0F;border:30px solid transparent;border-image:url(img/panel_card.png) 95 fill / 30px stretch;filter:drop-shadow(0 8px 0 rgba(0,0,0,.35));display:flex;flex-direction:column;gap:12px}
.card h1 img{display:block;width:min(240px,80%);height:auto;margin:-6px auto 0}
.card h1,.card h2{margin:0;font-family:var(--f-disp);font-weight:400;color:var(--clay);text-align:center;text-wrap:balance}
.card h1{font-size:32px}.card h2{font-size:26px}
.lead{margin:0;text-align:center;font-size:13.5px;line-height:1.55;color:#5B3A24}
.mode{all:unset;cursor:pointer;box-sizing:border-box;display:grid;grid-template-columns:60px 1fr;gap:3px 12px;align-items:center;padding:2px 2px 4px;border:20px solid transparent;border-width:16px 18px 22px;border-image:url(img/btn_mode.png) 70 90 90 90 fill / 16px 18px 22px stretch}
.mode:active{border-image-source:url(img/btn_mode_pressed.png);transform:translateY(2px)}
.mode:focus-visible,.btn:focus-visible{outline:3px solid var(--clay);outline-offset:2px}
.mode .pic{grid-row:span 3;width:60px;height:60px;display:flex;align-items:center;justify-content:center}.mode .pic img{width:60px;height:60px}
.mode b{font-family:var(--f-disp);font-weight:400;font-size:21px;color:#2B1A0F}
.mode span{font-size:12.5px;line-height:1.45;color:#5B3A24}
.mode small{font-family:var(--f-disp);font-size:12.5px;color:#8A6440;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:4px}
.mode small::before{content:'';width:18px;height:18px;background:url(img/icon_best.png) center/contain no-repeat}
.btn{all:unset;cursor:pointer;box-sizing:border-box;text-align:center;padding:2px 0 4px;font-family:var(--f-disp);font-size:19px;color:#FFFDF5;text-shadow:0 2px 0 rgba(60,20,10,.45);border:solid transparent;border-width:14px 22px 20px;border-image:url(img/btn_primary.png) 90 110 120 110 fill / 14px 22px 20px stretch}
.btn.sub{border-image-source:url(img/btn_sub.png);color:#5B3A24;text-shadow:none;font-size:17px}
.btn:active{border-image-source:url(img/btn_primary_pressed.png);transform:translateY(2px)}.btn.sub:active{border-image-source:url(img/btn_sub_pressed.png)}
.row{display:flex;gap:8px}.row .btn{flex:1}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px}
.res span{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;background:#FFFDF5;border:2px solid #C9A27A;font-family:var(--f-disp);font-size:12.5px;color:#5B3A24;font-variant-numeric:tabular-nums;text-align:center}
.res i{font-style:normal;font-size:22px;line-height:1}
.res b{font-weight:400;font-size:20px;color:#2F6328}
.note{margin:0;font-size:12px;line-height:1.5;color:#8A6440;text-align:center}
@media (prefers-reduced-motion: reduce){.btn:active,.mode:active{transform:none}}
</style>

<div id="wrap">
  <canvas id="cv" aria-label="채집 게임 화면"></canvas>

  <div class="ov" id="start">
    <div class="card" role="dialog" aria-labelledby="t1">
      <h1 id="t1"><img src="img/logo_title.png" alt="공방 채집터" width="813" height="291"></h1>
      <p class="lead">30초 동안 최대한 많이 캐 오세요.<br>조각 <b>5개</b>가 모이면 재료 <b>1개</b>가 돼요.</p>
      <button type="button" class="mode" data-m="dig">
        <span class="pic"><img src="img/icon_mode_dig.png" alt="" width="60" height="60"></span>
        <b>흙 파기</b>
        <span>공터를 누르면 맨 위 흙이 한 겹씩 벗겨져요. 깊을수록 좋은 흙(★)이 묻혀 있고, 다 드러나야 캐져요. 2초 안에 연달아 캐면 콤보! 큰 덩어리는 3개로 쳐요.</span>
        <small id="bestDig"></small>
      </button>
      <button type="button" class="mode" data-m="rock">
        <span class="pic"><img src="img/icon_mode_rock.png" alt="" width="60" height="60"></span>
        <b>돌 부수기</b>
        <span>손가락으로 돌을 쓸고 지나가면 부서지며 유약 원료가 나와요. 큰 돌일수록 많이 나와요. 반짝이는 황금 돌은 금방 사라지니 얼른 두 번 쓸어요 — 진사 확정!</span>
        <small id="bestRock"></small>
      </button>
    </div>
  </div>

  <div class="ov" id="end" hidden>
    <div class="card" role="dialog" aria-labelledby="t2">
      <h2 id="t2">채집 끝!</h2>
      <p class="lead" id="endSub"></p>
      <div class="res" id="endRes"></div>
      <p class="note" id="endNote"></p>
      <div class="row"><button type="button" class="btn sub" id="toTitle">처음으로</button><button type="button" class="btn" id="again">한 번 더</button></div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  var wrap = document.getElementById('wrap'), cv = document.getElementById('cv'), cx = cv.getContext('2d');
  var W = 390, H = 720, SC = 1, OX = 0, OY = 0, DPR = 1;

  }

  // ── 아이템 정의 ──
  var IT = {
    ry: { n: '황토', s: '황토', pts: 10, col: '#E2C79E', dk: '#8A6440', img: 'raw_y' },
    rr: { n: '적토', s: '적토', pts: 15, col: '#D49A7E', dk: '#7A3A20', img: 'raw_r' },
    rw: { n: '백토', s: '백토', pts: 25, col: '#F2EEE6', dk: '#A9A094', img: 'raw_w' },
    rk: { n: '흑토', s: '흑토', pts: 30, col: '#8E837A', dk: '#2E2622', img: 'raw_k' },
    rs: { n: '봄빛 흙', s: '봄빛', pts: 30, col: '#F0D3C7', dk: '#B05876', img: 'raw_s' },
    petal: { n: '벚꽃 재', s: '벚꽃', pts: 20, col: '#F2B6C6', dk: '#B05876', img: 'petal', gem: 1 },
    time: { n: '모래시계', s: '+3초', pts: 0, img: 'item_time' },
    white: { n: '장석', s: '장석', pts: 5, col: '#F4F1EA', dk: '#B9B2A4', img: 'mat_white', gem: 1 },
    celadon: { n: '청자 철분', s: '철분', pts: 5, col: '#8FC0A6', dk: '#3F7A5F', img: 'mat_celadon', gem: 1 },
    black: { n: '흑유 철광', s: '철광', pts: 5, col: '#4A403C', dk: '#1C1614', img: 'mat_black', gem: 1 },
    jinsa: { n: '진사', s: '진사', pts: 40, col: '#D2503E', dk: '#7A1E16', img: 'mat_jinsa', gem: 1 }
  };

  // ── 그래픽 소스 (img/*.png · 3배 원본) — 못 불러오면 기존 도형으로 그린다 ──
  var LNAME = ['layer0_grass', 'layer1_topsoil', 'layer2_brown', 'layer3_redclay', 'layer4_ochre', 'layer5_greyclay', 'layer6_white', 'layer7_bedrock'];
  var IM = {}, TEX = [], PAT = null, TEXS = null;
  LNAME.concat(['bg_sakura_ground', 'bg_gravel', 'raw_w', 'raw_y', 'raw_r', 'raw_k', 'raw_s', 'petal', 'item_time', 'mat_white', 'mat_celadon', 'mat_black', 'mat_jinsa', 'tool_shovel', 'tool_hammer',
    'panel_hud', 'bar_time_frame', 'bar_time_fill', 'bar_time_fill_low', 'fx_dirt_chunk', 'fx_dust', 'rock_s', 'rock_m_0', 'rock_m_1', 'rock_m_2', 'rock_l_0', 'rock_l_1', 'rock_l_2', 'rock_l_3', 'fx_rock_shard', 'fx_spark']).forEach(function (n) {
    var im = new Image();
    im.onload = function () {
      IM[n] = im; var li = LNAME.indexOf(n);
      if (n === 'bg_sakura_ground') { try { var c2 = document.createElement('canvas'); c2.width = c2.height = 512; var g2 = c2.getContext('2d'); g2.drawImage(im, 0, 0, 512, 512); var keep = LRGB[0]; TEXS = tone2(0, g2.getImageData(0, 0, 512, 512).data); LRGB[0] = keep; DR = null; dirty = true; } catch (e) {} }
      if (li >= 0) { try { var c = document.createElement('canvas'); c.width = c.height = 512; var g = c.getContext('2d'); g.drawImage(im, 0, 0, 512, 512); TEX[li] = tone2(li, g.getImageData(0, 0, 512, 512).data); DR = null; dirty = true; } catch (e) {} }
    };
    im.src = 'img/' + n + '.png';
  });
  // 층 밝기 맞추기 : 위층일수록 밝고 아래층일수록 어둡게 (색조는 유지, 평균 밝기만 목표값으로)
  var LUMA = [0, 175, 150, 128, 108, 88, 68, 43];
  function tone2(li, src) {
    if (!LUMA[li]) { return src; }
    var n = src.length / 4, r = 0, g = 0, b = 0, i;
    for (i = 0; i < src.length; i += 4) { r += src[i]; g += src[i + 1]; b += src[i + 2]; }
    r /= n; g /= n; b /= n; var f = LUMA[li] / (0.299 * r + 0.587 * g + 0.114 * b), out = new Uint8ClampedArray(src.length);
    for (i = 0; i < src.length; i += 4) { out[i] = src[i] * f; out[i + 1] = src[i + 1] * f; out[i + 2] = src[i + 2] * f; out[i + 3] = 255; }
    LRGB[li] = [Math.min(255, Math.round(r * f)), Math.min(255, Math.round(g * f)), Math.min(255, Math.round(b * f))];
    return out;
  }
  // 아이템 아이콘 : r = 예전 도형 반지름 기준
  function icon(k, x, y, r) {
    var d = IT[k], im = d.img && IM[d.img];
    if (im) { var s = r * 2.7; cx.drawImage(im, x - s / 2, y - s / 2, s, s); return; }
    if (k === 'time') { glass(x, y, r); } else if (d.gem) { gem(x, y, r, d); } else { blob(x, y, r, d); }
  }

  var GRAV = null, S = null, running = false, last = 0, DUR = 30;
  // 본게임에서 넘겨주는 설정 : 연구 효과 + 오늘의 채집지 (river 고령토↑ · mountain 자기토·특선↑ · mine 황금 돌·진사↑)
  var CFG = { gTime: 0, comboUp: 0, goldUp: 0, rareUp: 0, digWide: 0, site: '', event: false };
  function DIGK() { return CFG.event ? ['ry', 'rr', 'rw', 'rk', 'rs'] : ['ry', 'rr', 'rw', 'rk']; }
  function ROCKK() { return CFG.event ? ['white', 'celadon', 'black', 'jinsa', 'petal'] : ['white', 'celadon', 'black', 'jinsa']; }
  var EMBED = /[?&]embed=1/.test(location.search);
  function CW() { return 2 + (CFG.comboUp || 0); }
  function GF() { return (1 + (CFG.goldUp || 0)) * (CFG.site === 'mine' ? 1.5 : 1); }
  var BEST = { dig: 0, rock: 0 }; try { BEST = JSON.parse(localStorage.getItem('chj-best') || 'null') || BEST; } catch (e) {}
  function bestTxt() { document.getElementById('bestDig').textContent = '최고 ' + (BEST.dig || 0) + '점'; document.getElementById('bestRock').textContent = '최고 ' + (BEST.rock || 0) + '점'; }
  bestTxt();
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pick(list) { var t = list.reduce(function (a, b) { return a + b[1]; }, 0), x = Math.random() * t; for (var i = 0; i < list.length; i++) { x -= list[i][1]; if (x <= 0) { return list[i][0]; } } return list[0][0]; }

  // ════════ 흙 파기 (하나의 큰 공터 · 누른 자리 둘레가 한 층씩 파인다) ════════
  var LAYERS = 7, CELL = 2, F = { x: 15, y: 122, w: 360, h: 560, gw: 120, gh: 186 };
  // 층 색 : 잔디 → 표토 → 갈색흙 → 붉은 점토 → 황토 → 회색 점토 → 백토 → 바닥 암반
  var LRGB = [[118, 152, 78], [220, 166, 112], [200, 138, 88], [190, 106, 70], [140, 106, 64], [96, 92, 84], [74, 70, 62], [56, 42, 34]];
  var DEP = null, NOI = null, OFF = null, OCX = null, IMG = null, dirty = true, DR = null, K = 2, PW = 0, PH = 0;
  function layoutField() {
    F.x = 15; F.y = 122; F.w = W - 30; F.h = Math.floor((H - 22 - F.y) / CELL) * CELL;
    F.gw = Math.floor(F.w / CELL); F.gh = Math.floor(F.h / CELL);
  }
  function layoutGrid() { layoutField(); }
  function buildNoise(gw, gh) {
    var a = new Float32Array(gw * gh), b = new Float32Array(gw * gh), i, x, y;
    for (i = 0; i < a.length; i++) { a[i] = Math.random(); }
    for (var pass = 0; pass < 2; pass++) {
      for (y = 0; y < gh; y++) { for (x = 0; x < gw; x++) { var s = 0, n = 0; for (var dy = -1; dy <= 1; dy++) { for (var dx = -1; dx <= 1; dx++) { var xx = x + dx, yy = y + dy; if (xx >= 0 && yy >= 0 && xx < gw && yy < gh) { s += a[yy * gw + xx]; n++; } } } b[y * gw + x] = s / n; } }

    }
    // 잔디 얼룩용 고주파 점 섞기
    for (i = 0; i < a.length; i++) { a[i] = a[i] * 0.75 + Math.random() * 0.25; }
    return a;
  }
  // 층마다 나오는 흙 색 : 위는 황토·적토, 아래로 갈수록 백토·흑토 (채집지·축제가 비중을 바꾼다)
  function itemFor(l) {
    var W0 = [[['ry', 0.8], ['rr', 0.2]], [['ry', 0.6], ['rr', 0.4]], [['rr', 0.6], ['ry', 0.4]], [['ry', 0.4], ['rr', 0.3], ['rw', 0.3]], [['rw', 0.6], ['ry', 0.2], ['rk', 0.2]], [['rw', 0.6], ['rk', 0.4]], [['rk', 0.6], ['rw', 0.4]]][l - 1];
    var M = { river: { rw: 1.6 }, mountain: { ry: 1.4, rr: 1.4 }, mine: { rk: 1.6 } }[CFG.site] || {}, rare = 1 + (CFG.rareUp || 0) * 8;
    var w = W0.map(function (x) { return [x[0], x[1] * (M[x[0]] || 1) * (x[0] === 'rw' || x[0] === 'rk' ? rare : 1)]; });
    if (CFG.event) { w.push(['rs', 0.35]); }
    return pick(w);
  }
  function newDig() {
    layoutField();
    DEP = new Uint8Array(F.gw * F.gh); NOI = buildNoise(F.gw, F.gh);
    PW = F.gw * CELL * K; PH = F.gh * CELL * K; makePatches();
    OFF = document.createElement('canvas'); OFF.width = PW; OFF.height = PH; OCX = OFF.getContext('2d'); IMG = OCX.createImageData(PW, PH); DR = null; dirty = true;
    var items = [], plan = [[1, 3], [2, 4], [3, 5], [4, 5], [5, 6], [6, 6], [7, 6]];
    plan.forEach(function (pl) { for (var i = 0; i < pl[1]; i++) { items.push({ l: pl[0], k: itemFor(pl[0]) }); } });
    for (var t = 0; t < 6; t++) { items.push({ l: 1 + Math.floor(Math.random() * 4), k: 'time' }); }
    // 대형 흙 : 3~6층에 4덩이. 넓게 다 드러내야 캐지고, 3개로 친다
    for (var bg = 0; bg < 4; bg++) { var bl = 3 + bg; items.unshift({ l: bl, k: itemFor(bl), big: 1 }); }
    items.forEach(function (it) {
      var m = it.big ? 40 : 22;
      for (var a = 0; a < 40; a++) {
        it.x = rnd(m, F.w - m); it.y = rnd(m, F.h - m);
        if (!items.some(function (o) { if (o === it || o.x === undefined) { return false; } var bb = o.big || it.big; return Math.hypot(o.x - it.x, o.y - it.y) < (o.l === it.l ? (bb ? 76 : 44) : (bb ? 40 : 24)); })) { break; }
      }
    });
    return { mode: 'dig', t: 0, left: DUR, pre: 1.3, items: items, got: {}, fx: [], fly: [], parts: [], pops: [], digs: [], score: 0, taps: 0, shake: 0, combo: 0, lastGet: -9 };
  }
  function depthAt(lx, ly) { var gx = Math.floor(lx / CELL), gy = Math.floor(ly / CELL); if (gx < 0 || gy < 0 || gx >= F.gw || gy >= F.gh) { return 0; } return DEP[gy * F.gw + gx]; }
  function dig(p, drag) {
    var lx = p.x - F.x, ly = p.y - F.y; if (lx < -10 || ly < -10 || lx > F.w + 10 || ly > F.h + 10) { return; }
    S.taps++;
    var cxg = lx / CELL, cyg = ly / CELL, R = 38 * (1 + (CFG.digWide || 0)) / CELL, ph = Math.random() * 7, any = false, cells = [], top = 99;
    for (var gy = Math.floor(cyg - R - 2); gy <= Math.ceil(cyg + R + 2); gy++) {
      for (var gx = Math.floor(cxg - R - 2); gx <= Math.ceil(cxg + R + 2); gx++) {
        if (gx < 0 || gy < 0 || gx >= F.gw || gy >= F.gh) { continue; }
        var dx = gx - cxg, dy = gy - cyg, ang = Math.atan2(dy, dx), rr0 = R * (0.88 + 0.08 * Math.sin(ang * 3 + ph) + 0.04 * Math.sin(ang * 7 + ph * 2));
        if (dx * dx + dy * dy > rr0 * rr0) { continue; }
        var ci = gy * F.gw + gx; cells.push(ci); if (DEP[ci] < top) { top = DEP[ci]; }
      }
    }
