<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2B1A0F">
<title>물레 성형</title>
<script src="./support.js"></script>
<script src="./shared.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif}
a{color:#5B3A24}a:hover{color:#3E2616}
button{font-family:inherit;cursor:pointer}
@keyframes wheelspin{to{stroke-dashoffset:-48}}
@keyframes mkBob{0%,100%{transform:translate(0,0)}50%{transform:translate(var(--mx),var(--my))}}
.spin{animation-name:wheelspin;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes segPop{0%{transform:scale(.4);opacity:1}100%{transform:scale(2.2);opacity:0}}
</style>
<style>
@keyframes navLand{0%{transform:scale(1,1)}25%{transform:scale(1.06,.9)}55%{transform:translateY(-12px) scale(.98,1.03)}80%{transform:translateY(0) scale(1.02,.98)}100%{transform:translateY(0) scale(1,1)}}
@keyframes navShake{0%{transform:translate(0,0)}15%{transform:translate(-5px,4px)}35%{transform:translate(5px,-3px)}55%{transform:translate(-3px,2px)}75%{transform:translate(2px,-1px)}100%{transform:translate(0,0)}}
@keyframes navDust{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
@keyframes navPulse{0%,100%{opacity:.85}50%{opacity:1}}
.bg-bg-wheel{background:#BFA584 url(_blob/a4d6614eb4ba5f50ddfa30a0ea8a46c3.webp) center/cover no-repeat}
.navdrop>div{height:724px !important}
body:has(.navdrop [role=dialog]) [data-nav]{display:none !important}
body:has(.navdrop [role=dialog]) .navarrows{display:none}
</style>
</helmet>
<div style="{{navRoot}}">
  <div style="position:absolute;left:0;top:0;right:0;height:56px;box-sizing:border-box;background:#3E2616;border-bottom:2px solid #2B1A0F">
    <a href="Queue.dc.html" aria-label="작업 대기함 {{navWip}}개" style="transform:{{chipTf}};z-index:41;position:absolute;left:6px;top:5px;width:62px;height:44px;box-sizing:border-box;border-radius:11px;background:#5B3A24;border:2px solid #FFD66B;box-shadow:0 3px 0 #2B1A0F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1;font-family:'Jua',sans-serif;color:#FFE7A8;text-decoration:none"><img src="_blob/3ef48cbb2fb638b04dbc2f27fc2f65b1.webp" alt="" aria-hidden="true" draggable="false" style="width:22px;height:20px;object-fit:contain"><span style="font-size:11.5px">대기함 <span style="color:#FFD66B">{{navWip}}</span></span></a>
    <div onPointerDown="{{navBarDown}}" onPointerMove="{{navBarMove}}" onPointerUp="{{navBarUp}}" onPointerCancel="{{navBarUp}}" onClickCapture="{{navBarClick}}" role="navigation" aria-label="제작 공정" style="position:absolute;left:74px;right:4px;top:0;height:56px;overflow:hidden;touch-action:pan-y;cursor:grab">
      <div style="{{navStrip}}">
        <sc-for list="{{navSteps}}" as="ns" hint-placeholder-count="7">
          <a href="{{ns.href}}" aria-label="{{ns.aria}}" draggable="false" style="{{ns.style}}"><img dc-src="{{ns.icon}}" alt="" aria-hidden="true" draggable="false" style="{{ns.iconStyle}}"><span>{{ns.label}}</span></a>
        </sc-for>
      </div>
      <div aria-hidden="true" style="{{navFadeL}}"></div>
      <div aria-hidden="true" style="{{navFadeR}}"></div>
    </div>
  </div>
  <button type="button" onClick="{{navMenuTap}}" aria-hidden="true" tabindex="-1" aria-label="메뉴 열기" aria-expanded="{{navMenuOpen}}" style="{{navMenuBtn}}">☰<span style="font-size:10px;line-height:1">메뉴</span></button>
  <div onPointerDownCapture="{{navDown}}" onPointerMoveCapture="{{navMove}}" onPointerUpCapture="{{navUp}}" onPointerCancelCapture="{{navUp}}" onClickCapture="{{navClickCap}}" style="{{navStage}}">
    <div class="navdrop" style="{{navDropStyle}}">
<div class="bg-bg-wheel" style="position:relative;width:390px;height:844px;overflow:hidden;color:#2B1A0F">

  <div style="position:absolute;left:12px;top:12px;right:12px;display:flex;align-items:center;gap:10px">
    <a href="Main.dc.html" aria-label="공방으로 돌아가기" style="flex:0 0 46px;height:46px;box-sizing:border-box;border-radius:50%;background:#FFF4DE;border:3px solid #5B3A24;box-shadow:0 3px 0 #5B3A24;display:flex;align-items:center;justify-content:center;color:#5B3A24">
      <svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"></path></svg>
    </a>
    <div style="flex:1 1 auto;height:40px;display:flex;align-items:center;justify-content:center;background:#A3442C;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);font-family:'Jua',sans-serif;font-size:19px;color:#FFF4DE;text-shadow:0 2px 0 #7A2F1E">{{targetName}} 빚기</div>
  </div>

  <div style="position:absolute;left:12px;right:12px;top:64px;display:flex;align-items:stretch;gap:6px">
    <button type="button" onClick="{{openClay}}" aria-label="흙 바꾸기 · 지금 {{clayName}}" style="all:unset;cursor:pointer;flex:0 0 auto;box-sizing:border-box;display:flex;align-items:center;gap:5px;padding:4px 9px 4px 6px;border-radius:12px;background:#FFF4DE;border:3px solid #5B3A24;box-shadow:0 3px 0 #5B3A24">
      <img dc-src="{{clayImg}}" alt="" aria-hidden="true" style="width:30px;height:24px;object-fit:contain">
      <span style="display:flex;flex-direction:column;line-height:1.05"><span style="font-size:11px;font-weight:700;color:#A3442C">흙</span><span style="font-family:'Jua',sans-serif;font-size:14px;color:#2B1A0F;white-space:nowrap">{{clayName}} ▾</span></span>
    </button>
    <button type="button" onClick="{{openTarget}}" aria-label="목표 모양 바꾸기 · 지금 {{targetName}}" style="all:unset;cursor:pointer;flex:0 1 auto;min-width:0;box-sizing:border-box;display:flex;align-items:center;gap:5px;padding:4px 9px 4px 6px;border-radius:12px;background:#FFF4DE;border:3px solid #5B3A24;box-shadow:0 3px 0 #5B3A24">
      <svg width="28" height="28" viewBox="{{tgIcon.vb}}" aria-hidden="true" style="flex:0 0 auto"><path d="{{tgIcon.d}}" fill="#E8D3B5" stroke="#5B3A24" stroke-width="{{tgIcon.sw}}" stroke-linejoin="round"></path></svg>
      <span style="display:flex;flex-direction:column;line-height:1.05;min-width:0"><span style="{{tgTagStyle}}">{{tgTag}}</span><span style="font-family:'Jua',sans-serif;font-size:14px;color:#2B1A0F;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{targetName}} ▾</span></span>
    </button>
  </div>

  <div role="meter" aria-label="목표 일치율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{fitPct}}" style="position:absolute;left:12px;right:12px;top:116px;height:62px;box-sizing:border-box;padding:6px 14px;border-radius:16px;background:rgba(43,26,15,.88);border:3px solid #3E2616;display:flex;align-items:center;gap:12px">
    <div style="flex:0 0 auto;display:flex;flex-direction:column;line-height:1">
      <span style="font-size:11px;font-weight:700;color:#E8D3B5">일치율</span>
      <span style="font-family:'Jua',sans-serif;font-size:34px;color:{{fitCol}};text-shadow:0 2px 0 rgba(0,0,0,.4)">{{fitPct}}<span style="font-size:18px">%</span></span>
    </div>
    <div style="flex:1 1 auto;display:flex;flex-direction:column;gap:5px;min-width:0">
      <div style="height:12px;border-radius:6px;background:rgba(255,244,222,.18);overflow:hidden"><div style="{{fitBar}}"></div></div>
      <span style="font-family:'Jua',sans-serif;font-size:19px;letter-spacing:2px;color:#FFD66B;line-height:1">{{fitStars}}</span>
    </div>
  </div>

  <div style="position:absolute;left:12px;right:12px;top:188px;height:500px;box-sizing:border-box;border:2px dashed #6B4A2C;border-radius:16px;background:rgba(255,248,235,.18)">
    

    <svg style="position:absolute;left:8px;top:44px;overflow:visible" width="350" height="384" viewBox="0 0 300 330" role="img" aria-label="물레 위의 흙, 실시간 렌더">
      <defs>
        <linearGradient id="clayShade" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0" stop-color="{{clayDark}}"></stop>
          <stop offset="0.38" stop-color="{{clayLight}}"></stop>
          <stop offset="0.62" stop-color="{{clayColor}}"></stop>
          <stop offset="1" stop-color="{{clayDark}}"></stop>
        </linearGradient>
        <clipPath id="potClip"><path d="{{potPath}}"></path></clipPath>
      </defs>
      <image href="_blob/3c9b10b6a96c1ab7d724ba551332b361.webp" x="30" y="232" width="258" height="207"></image>
      <ellipse class="spin" cx="150" cy="290" rx="66" ry="22" fill="none" stroke="#C9B49A" stroke-width="3" stroke-dasharray="14 34" style="{{spinStyle}}"></ellipse>
      <ellipse class="spin" cx="150" cy="290" rx="40" ry="13" fill="none" stroke="#B19A80" stroke-width="2" stroke-dasharray="10 38" style="{{spinStyle}}"></ellipse>
      <g transform="{{dropTf}}" opacity="{{dropOp}}">
      <ellipse cx="{{foot.cx}}" cy="291" rx="{{foot.rx}}" ry="{{foot.ry}}" fill="#2B1A0F" opacity="0.28"></ellipse>
      <path d="{{potPath}}" fill="url(#clayShade)" stroke="{{clayEdge}}" stroke-width="2"></path>
      <sc-for list="{{rings}}" as="rg" hint-placeholder-count="10">
        <line class="spin" x1="{{rg.x1}}" x2="{{rg.x2}}" y1="{{rg.y}}" y2="{{rg.y}}" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1.6" stroke-dasharray="8 16" style="{{spinStyle}}"></line>
      </sc-for>
      <ellipse cx="{{rim.cx}}" cy="{{rim.cy}}" rx="{{rim.rx}}" ry="{{rim.ry}}" fill="{{clayColor}}" stroke="{{clayEdge}}" stroke-width="2"></ellipse>
      <ellipse cx="{{rim.cx}}" cy="{{rim.cy}}" rx="{{rim.irx}}" ry="{{rim.iry}}" fill="#3E2616" opacity="0.55"></ellipse>
      </g>
      <g transform="{{dustTf}}" opacity="{{dustOp}}" pointer-events="none">
        <ellipse cx="112" cy="292" rx="22" ry="8" fill="#D9C2A2" opacity="0.8"></ellipse>
        <ellipse cx="188" cy="292" rx="22" ry="8" fill="#D9C2A2" opacity="0.8"></ellipse>
        <ellipse cx="150" cy="298" rx="30" ry="7" fill="#E8D6BC" opacity="0.7"></ellipse>
      </g>
      <path d="{{ghostPath}}" fill="none" stroke="#2B1A0F" stroke-width="4.2" stroke-dasharray="6 6" opacity="0.35" pointer-events="none"></path>
      <path d="{{ghostPath}}" fill="none" stroke="#FFF4DE" stroke-width="2.2" stroke-dasharray="6 6" opacity="0.95" pointer-events="none"></path>
      <sc-for list="{{marks}}" as="mk" hint-placeholder-count="0">
        <g pointer-events="none" style="{{mk.anim}}"><circle cx="{{mk.x}}" cy="{{mk.y}}" r="11" fill="{{mk.c}}" stroke="#2B1A0F" stroke-width="2"></circle><text x="{{mk.x}}" y="{{mk.ty}}" text-anchor="middle" font-family="Jua, sans-serif" font-size="13" fill="#2B1A0F">{{mk.t}}</text></g>
      </sc-for>
      <path d="{{segDonePath}}" fill="none" stroke="#1E5E16" stroke-width="7" stroke-linecap="round" opacity="0.55" pointer-events="none"></path>
      <path d="{{segDonePath}}" fill="none" stroke="#8CF27A" stroke-width="3.6" stroke-linecap="round" pointer-events="none"></path>
      <sc-for list="{{segSpark}}" as="sp" hint-placeholder-count="0">
        <g pointer-events="none"><circle cx="{{sp.rx}}" cy="{{sp.y}}" r="7" fill="none" stroke="#FFF7B0" stroke-width="2.5" style="animation:segPop .6s ease-out both;transform-box:fill-box;transform-origin:center"></circle><circle cx="{{sp.lx}}" cy="{{sp.y}}" r="7" fill="none" stroke="#FFF7B0" stroke-width="2.5" style="animation:segPop .6s ease-out both;transform-box:fill-box;transform-origin:center"></circle></g>
      </sc-for>


      <sc-if value="{{grabOn}}" hint-placeholder-val="{{false}}">
        <rect x="0" y="{{grab.y1}}" width="300" height="{{grab.h}}" fill="#FFE7A8" opacity="{{grab.op}}" clip-path="url(#potClip)"></rect>
        <line x1="10" x2="290" y1="{{grab.y}}" y2="{{grab.y}}" stroke="#FFE7A8" stroke-width="1.4" stroke-dasharray="3 5"></line>
        <circle cx="{{grab.hx}}" cy="{{grab.y}}" r="13" fill="#FFF4DE" fill-opacity="0.55" stroke="#2B1A0F" stroke-width="2"></circle>
        <text x="150" y="{{grab.ly}}" text-anchor="middle" font-family="Jua, sans-serif" font-size="12" fill="#FFF4DE" stroke="#2B1A0F" stroke-width="0.6">{{grab.label}}</text>
      </sc-if>

      <sc-if value="{{gd.on}}" hint-placeholder-val="{{false}}">
        <g aria-hidden="true" style="pointer-events:none">
          <circle cx="{{gd.cl}}" cy="{{gd.cy}}" r="{{gd.r}}" fill="rgba(255,231,168,.25)" stroke="#FFE7A8" stroke-width="2.5" opacity="{{gd.rop}}"></circle>
          <circle cx="{{gd.cr}}" cy="{{gd.cy}}" r="{{gd.r}}" fill="rgba(255,231,168,.25)" stroke="#FFE7A8" stroke-width="2.5" opacity="{{gd.rop}}"></circle>
          <image href="_blob/a795fdcbe57fe24aff00e58aef9dce47.webp" x="{{gd.lx}}" y="{{gd.y}}" width="40" height="111" opacity="{{gd.op}}"></image>
          <image href="_blob/97dc46d26eb0d59475dcf2e6abaca47b.webp" x="{{gd.rx}}" y="{{gd.y}}" width="40" height="111" opacity="{{gd.op}}"></image>
          <rect x="{{gd.bx}}" y="{{gd.by}}" width="{{gd.bw}}" height="26" rx="13" fill="#2B1A0F" fill-opacity=".82" stroke="#FFE7A8" stroke-width="1.5" opacity="{{gd.top}}"></rect>
          <text x="150" y="{{gd.ty}}" text-anchor="middle" font-family="Jua, sans-serif" font-size="15" fill="#FFE7A8" opacity="{{gd.top}}">{{gd.text}}</text>
        </g>
      </sc-if>
      <sc-if value="{{wrapping}}" hint-placeholder-val="{{false}}">
        <image href="_blob/a795fdcbe57fe24aff00e58aef9dce47.webp" x="{{hands.ilx}}" y="{{hands.iy}}" width="40" height="111"></image>
        <image href="_blob/97dc46d26eb0d59475dcf2e6abaca47b.webp" x="{{hands.irx}}" y="{{hands.iy}}" width="40" height="111"></image>
      </sc-if>

      <sc-if value="{{hdl.on}}" hint-placeholder-val="{{true}}">
        <line x1="150" y1="{{hdl.ly1}}" x2="150" y2="{{hdl.ly2}}" stroke="#FFE7A8" stroke-width="2" stroke-dasharray="3 3"></line>
        <rect id="wHdl" x="122" y="{{hdl.y}}" width="56" height="24" rx="12" fill="{{hdl.fill}}" stroke="#2B1A0F" stroke-width="2"></rect>
        <text x="150" y="{{hdl.ty}}" text-anchor="middle" font-family="Jua, sans-serif" font-size="12" fill="#2B1A0F">▲ 높이 ▼</text>
      </sc-if>
      <sc-if value="{{fxFail}}" hint-placeholder-val="{{false}}">
        <g pointer-events="none">
          <g transform="{{fx.colTf}}" opacity="{{fx.colOp}}">
            <path d="{{fx.path}}" fill="url(#clayShade)" stroke="{{clayEdge}}" stroke-width="2"></path>
          </g>
          <sc-for list="{{fx.blobs}}" as="bl" hint-placeholder-count="8">
            <circle cx="{{bl.x}}" cy="{{bl.y}}" r="{{bl.r}}" fill="{{clayColor}}" stroke="{{clayEdge}}" stroke-width="1.2" opacity="{{bl.op}}"></circle>
          </sc-for>
        </g>
      </sc-if>
      <sc-if value="{{fxOk}}" hint-placeholder-val="{{false}}">
        <g pointer-events="none">
          <ellipse cx="150" cy="{{fx.cy}}" rx="{{fx.ringR}}" ry="{{fx.ringR}}" fill="none" stroke="#FFE7A8" stroke-width="6" opacity="{{fx.ringOp}}"></ellipse>
          <sc-for list="{{fx.sparks}}" as="sp" hint-placeholder-count="10">
            <text x="{{sp.x}}" y="{{sp.y}}" text-anchor="middle" font-size="{{sp.fs}}" fill="#FFD66B" stroke="#8A6410" stroke-width="0.8" opacity="{{sp.op}}">✦</text>
          </sc-for>
        </g>
      </sc-if>
    </svg>

    <div style="position:absolute;left:8px;top:162px;width:40px;box-sizing:border-box;padding:6px 5px;border-radius:12px;background:rgba(43,26,15,.85);border:2px solid #3E2616;display:flex;flex-direction:column-reverse;align-items:center;gap:3px" role="img" aria-label="높이별 두께">
      <span style="{{tminStyle}}">{{tmin}}</span>
      <sc-for list="{{segs}}" as="s" hint-placeholder-count="12">
        <span style="{{s.style}}"></span>
      </sc-for>
      <span style="font-family:'Jua',sans-serif;font-size:11.5px;color:#FFE7A8">두께</span>

    </div>

    <div data-work="1" onPointerDown="{{pDown}}" onPointerMove="{{pMove}}" onPointerUp="{{pUp}}" onPointerCancel="{{pUp}}" onContextMenu="{{noMenu}}" aria-label="흙을 드래그해서 빚는 영역" style="position:absolute;left:52px;right:0;top:0;bottom:44px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab"></div>

    <sc-if value="{{fxFail}}" hint-placeholder-val="{{false}}">
      <div aria-hidden="true" style="position:absolute;inset:0;border-radius:14px;pointer-events:none;background:radial-gradient(circle at 50% 60%,rgba(208,69,43,.0) 20%,rgba(208,69,43,.55) 100%);opacity:{{fx.flash}}"></div>
      <div role="alert" style="position:absolute;left:50%;top:44%;pointer-events:none;white-space:nowrap;padding:8px 18px;border-radius:16px;background:rgba(43,26,15,.9);border:3px solid #D0452B;font-family:'Jua',sans-serif;font-size:28px;color:#FFB08A;text-shadow:0 2px 0 #5A1A0E;{{fx.pop}}">와르르… 실패</div>
    </sc-if>
    <sc-if value="{{fxOk}}" hint-placeholder-val="{{false}}">
      <div aria-hidden="true" style="position:absolute;inset:0;border-radius:14px;pointer-events:none;background:radial-gradient(circle at 50% 60%,rgba(255,231,168,.55) 0%,rgba(255,231,168,0) 60%);opacity:{{fx.flash}}"></div>
      <div role="status" style="position:absolute;left:50%;top:40%;pointer-events:none;white-space:nowrap;display:flex;flex-direction:column;align-items:center;padding:8px 18px;border-radius:16px;background:rgba(47,99,40,.92);border:3px solid #E4F5D8;font-family:'Jua',sans-serif;color:#FFFDF5;{{fx.pop}}"><span style="font-size:26px">성형 완료!</span><span style="font-size:18px;letter-spacing:2px;color:#FFD66B">{{fx.stars}}</span></div>
    </sc-if>
  </div>

  <div style="position:absolute;left:12px;right:12px;bottom:14px;box-sizing:border-box;padding:12px 14px 14px;background:#FFF4DE;border:4px solid #5B3A24;border-radius:24px;box-shadow:inset 0 0 0 3px #F0D9AE,0 6px 0 rgba(43,26,15,.4);display:flex;flex-direction:column;gap:10px">
    <div style="display:none;align-items:center;gap:10px">
      <span style="font-family:'Jua',sans-serif;font-size:14px;color:#5B3A24;flex:0 0 auto">흔들림</span>
      <div style="position:relative;flex:1 1 auto;height:18px;box-sizing:border-box;border:3px solid #3E2616;border-radius:10px;background:#3E2616;overflow:hidden" role="img" aria-label="흔들림 게이지 · 가득 차면 무너짐">
        <div style="{{wBarStyle}}"></div>
        <span aria-hidden="true" style="position:absolute;left:70%;top:0;bottom:0;width:2px;background:#E8B640"></span>
      </div>
      <span style="{{wLabelStyle}}">{{wLabel}}</span>
    </div>
    <div style="display:flex;gap:8px">
      <div style="flex:1 1 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:3px solid #5B3A24;border-radius:14px;overflow:hidden">
        <sc-for list="{{speeds}}" as="sp" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{sp.on}}" onClick="{{sp.pick}}" style="{{sp.style}}">{{sp.label}}</button>
        </sc-for>
      </div>
      <button type="button" onClick="{{finish}}" style="{{finishStyle}}">
        <span style="font-family:'Jua',sans-serif;font-size:19px">완성</span>
        <span style="font-size:11px;font-weight:700;opacity:.9">성형 대기로 · 새 흙</span>
      </button>
    </div>
  </div>


  <sc-if value="{{sheetOn}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;left:0;top:0;width:390px;height:724px;z-index:70;background:rgba(26,15,8,.6);display:flex;align-items:flex-end">
      <div role="dialog" aria-label="{{sheetTitle}}" style="width:390px;max-height:600px;box-sizing:border-box;padding:16px 14px 18px;background:#FFF4DE;border-top:4px solid #5B3A24;border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-family:'Jua',sans-serif;font-size:20px;color:#2B1A0F">{{sheetTitle}}</span><span style="font-size:11.5px;color:#7A5434">{{sheetSub}}</span></div>
          <button type="button" onClick="{{closeSheet}}" aria-label="닫기" style="all:unset;cursor:pointer;margin-left:auto;flex:0 0 42px;height:42px;box-sizing:border-box;border-radius:50%;background:#5B3A24;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:17px;color:#FFE7A8">✕</button>
        </div>
