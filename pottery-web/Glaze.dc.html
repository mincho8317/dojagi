<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2B1A0F">
<title>유약 바르기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif}
a{color:#5B3A24}a:hover{color:#3E2616}
button{font-family:inherit;cursor:pointer}
</style>
<style>
@keyframes navLand{0%{transform:scale(1,1)}25%{transform:scale(1.06,.9)}55%{transform:translateY(-12px) scale(.98,1.03)}80%{transform:translateY(0) scale(1.02,.98)}100%{transform:translateY(0) scale(1,1)}}
@keyframes navShake{0%{transform:translate(0,0)}15%{transform:translate(-5px,4px)}35%{transform:translate(5px,-3px)}55%{transform:translate(-3px,2px)}75%{transform:translate(2px,-1px)}100%{transform:translate(0,0)}}
@keyframes navDust{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
@keyframes navPulse{0%,100%{opacity:.85}50%{opacity:1}}
.bg-bg-glaze{background:#C5B79E url(_blob/e41f40f93735cbd82c4bab97fd696e6c.webp) center/cover no-repeat}
</style>
</helmet>
<div data-navroot="1" style="{{navRoot}}">
<svg aria-hidden="true" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden"><defs>
<linearGradient id="potShade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".42"></stop><stop offset=".2" stop-color="#000" stop-opacity=".12"></stop><stop offset=".33" stop-color="#fff" stop-opacity="0"></stop><stop offset=".4" stop-color="#fff" stop-opacity=".42"></stop><stop offset=".47" stop-color="#fff" stop-opacity=".1"></stop><stop offset=".6" stop-color="#fff" stop-opacity="0"></stop><stop offset=".8" stop-color="#000" stop-opacity=".16"></stop><stop offset="1" stop-color="#000" stop-opacity=".46"></stop></linearGradient>
<linearGradient id="potTopLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"></stop><stop offset=".35" stop-color="#fff" stop-opacity="0"></stop><stop offset=".85" stop-color="#000" stop-opacity="0"></stop><stop offset="1" stop-color="#000" stop-opacity=".18"></stop></linearGradient>
<pattern id="potPlum" patternUnits="objectBoundingBox" patternContentUnits="objectBoundingBox" width=".5" height=".3"><g fill="#FFF4F6" fill-opacity=".85"><circle cx=".25" cy=".09" r=".035"></circle><circle cx=".31" cy=".135" r=".035"></circle><circle cx=".285" cy=".2" r=".035"></circle><circle cx=".215" cy=".2" r=".035"></circle><circle cx=".19" cy=".135" r=".035"></circle></g><circle cx=".25" cy=".145" r=".022" fill="#E2607E"></circle><path d="M.02 .27C.1 .24 .14 .2 .19 .16" stroke="#5B3A24" stroke-opacity=".55" stroke-width=".012" fill="none"></path></pattern>
<pattern id="potRings" patternUnits="objectBoundingBox" patternContentUnits="objectBoundingBox" width="1" height=".19"><rect x="0" y=".15" width="1" height=".012" fill="#000" fill-opacity=".06"></rect><rect x="0" y=".162" width="1" height=".008" fill="#fff" fill-opacity=".08"></rect></pattern>
<clipPath id="potFoot" clipPathUnits="objectBoundingBox"><path d="M0 .885C.07 .86 .11 .93 .19 .9C.26 .87 .3 .95 .38 .915C.46 .88 .51 .945 .6 .905C.68 .87 .72 .935 .8 .9C.88 .87 .93 .925 1 .885L1 1L0 1Z"></path></clipPath>
<clipPath id="potDrip" clipPathUnits="objectBoundingBox"><path d="M0 .87C.07 .845 .11 .915 .19 .885C.26 .855 .3 .935 .38 .9C.46 .865 .51 .93 .6 .89C.68 .855 .72 .92 .8 .885C.88 .855 .93 .91 1 .87L1 .9C.93 .935 .88 .885 .8 .91C.72 .945 .68 .88 .6 .92C.51 .955 .46 .89 .38 .93C.3 .96 .26 .88 .19 .915C.11 .945 .07 .875 0 .9Z"></path></clipPath>
<filter id="potGrain" x="0" y="0" width="1" height="1" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".55" numOctaves="3" seed="7" result="n"></feTurbulence><feColorMatrix in="n" type="matrix" values="0 0 0 0 .16  0 0 0 0 .09  0 0 0 0 .04  0 0 0 -1.6 1.05"></feColorMatrix><feComposite operator="in" in2="SourceGraphic"></feComposite></filter>
</defs></svg>
  <div style="position:absolute;left:0;top:0;right:0;height:56px;box-sizing:border-box;background:#3E2616;border-bottom:2px solid #2B1A0F">
    <a href="Queue.dc.html" aria-label="작업 대기함 {{navWip}}개" style="transform:{{qTf}};z-index:46;position:absolute;left:6px;top:5px;width:62px;height:44px;box-sizing:border-box;border-radius:11px;background:#5B3A24;border:2px solid #FFD66B;box-shadow:0 3px 0 #2B1A0F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1;font-family:'Jua',sans-serif;color:#FFE7A8;text-decoration:none"><img src="_blob/3ef48cbb2fb638b04dbc2f27fc2f65b1.webp" alt="" aria-hidden="true" draggable="false" style="width:22px;height:20px;object-fit:contain"><span style="font-size:11.5px">대기함 <span style="color:#FFD66B">{{navWip}}</span></span></a>
    <div onPointerDown="{{navBarDown}}" onPointerMove="{{navBarMove}}" onPointerUp="{{navBarUp}}" onPointerCancel="{{navBarUp}}" onClickCapture="{{navBarClick}}" role="navigation" aria-label="제작 공정" style="position:absolute;left:74px;right:4px;top:0;height:56px;overflow:hidden;touch-action:pan-y;cursor:grab">
      <div style="{{navStrip}}">
        <sc-for list="{{navSteps}}" as="ns" hint-placeholder-count="7">
          <a href="{{ns.href}}" aria-label="{{ns.aria}}" draggable="false" style="{{ns.style}}"><img dc-src="{{ns.icon}}" alt="" aria-hidden="true" draggable="false" style="{{ns.iconStyle}}"><span>{{ns.label}}</span></a>
        </sc-for>
      </div>
      <div aria-hidden="true" style="{{navFadeL}}"></div>
      <div aria-hidden="true" style="{{navFadeR}}"></div>
    </div>
  </div>
  <div onPointerDownCapture="{{navDown}}" onPointerMoveCapture="{{navMove}}" onPointerUpCapture="{{navUp}}" onPointerCancelCapture="{{navUp}}" onClickCapture="{{navClickCap}}" style="{{navStage}}">
    <div style="{{navDropStyle}}">
<div class="bg-bg-glaze" style="position:relative;width:390px;height:844px;overflow:hidden;color:#2B1A0F">

  <div style="position:absolute;left:12px;top:12px;right:12px;display:flex;align-items:center;gap:10px">
    <a href="Main.dc.html" aria-label="공방으로 돌아가기" style="flex:0 0 46px;height:46px;box-sizing:border-box;border-radius:50%;background:#FFF4DE;border:3px solid #5B3A24;box-shadow:0 3px 0 #5B3A24;display:flex;align-items:center;justify-content:center;color:#5B3A24">
      <svg width="20" height="20" viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"></path></svg>
    </a>
    <div style="flex:1 1 auto;height:40px;display:flex;align-items:center;justify-content:center;background:#B9533A;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);font-family:'Jua',sans-serif;font-size:19px;color:#FFF4DE;text-shadow:0 2px 0 #7A2F1E">유약 바르기</div>
  </div>

  <div aria-hidden="true" style="position:absolute;left:56px;top:362px;width:278px;height:140px;pointer-events:none">
    <img src="_blob/77f6907c1843f9b7401e349e55ada0fa.webp" alt="" aria-hidden="true" draggable="false" style="position:absolute;left:0;top:0;width:278px;height:140px;filter:drop-shadow(0 5px 4px rgba(43,26,15,.35))">
    <div style="{{liquid}}"></div>
  </div>

  <div id="gpot" style="{{potWrap}}">
    <button type="button" onClick="{{openPick}}" aria-label="유약 바를 기물 고르기" style="all:unset;cursor:pointer;position:absolute;left:-20px;right:-20px;top:-10px;bottom:-10px;z-index:2;border-radius:16px"></button>
    <span style="{{potHintStyle}}">{{potHint}}</span>
    <svg width="120" height="140" viewBox="{{cur.vb}}" role="img" aria-label="시유 중인 작품, 실시간 렌더">
      <path d="{{cur.d}}" fill="{{cur.bisque}}"></path>
      <path d="{{cur.d}}" fill="{{cur.coat}}" opacity="{{cur.coatOp}}"></path>
      <path d="{{cur.d}}" fill="url(#potTopLight)" opacity="{{cur.vis}}"></path>
      <path d="{{cur.d}}" fill="{{cur.rings}}" opacity="{{cur.vis}}"></path>
      <path d="{{cur.d}}" fill="#000" filter="url(#potGrain)" opacity="{{cur.grain}}"></path>
      <path d="{{cur.d}}" fill="url(#potShade)" opacity="{{cur.vis}}"></path>
      <path d="{{cur.d}}" fill="none" stroke="{{cur.edge}}" stroke-width="{{cur.sw}}" stroke-linejoin="round"></path>
      <ellipse cx="0" cy="{{cur.rimY}}" rx="{{cur.rimRx}}" ry="{{cur.rimRy}}" fill="{{cur.inner}}" stroke="{{cur.edge}}" stroke-width="{{cur.sw}}"></ellipse>
    </svg>
  </div>

  <div aria-hidden="true" style="{{ripple}}"></div>

  <div style="{{condStyle}}">{{condText}}</div>

  <div style="position:absolute;left:12px;right:12px;bottom:14px;box-sizing:border-box;padding:14px 16px 16px;background:#FFF4DE;border:4px solid #5B3A24;border-radius:24px;box-shadow:inset 0 0 0 3px #F0D9AE,0 6px 0 rgba(43,26,15,.4);display:flex;flex-direction:column;gap:11px">

    <div style="display:flex;flex-direction:column;gap:5px">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <span style="font-family:'Jua',sans-serif;font-size:15px;color:#5B3A24">담금 시간</span>
        <span style="{{zoneStyle}}">{{zoneLabel}}</span>
      </div>
      <div style="position:relative;height:22px;box-sizing:border-box;border:3px solid #3E2616;border-radius:12px;background:#3E2616;display:flex;overflow:hidden" role="img" aria-label="담금 시간 게이지">
        <span style="{{gg.s1}}background:#8EA3A8"></span>
        <span style="{{gg.s2}}background:#5FB052;box-shadow:inset 0 3px 0 rgba(255,255,255,.3)"></span>
        <span style="{{gg.s3}}background:#D9A93A"></span>
        <span style="flex:1 1 auto;background:#C9705A"></span>
        <span style="{{needle}}"></span>
      </div>
      <div style="display:flex;font-size:10.5px;font-weight:700;color:#7A5434">
        <span style="{{gg.s1}}">얇음</span><span style="{{gg.s2}}color:#2F6328;white-space:nowrap">적정</span><span style="{{gg.s3}}">두껍</span><span style="flex:1 1 auto;text-align:right">흘러내림</span>
      </div>
    </div>

    <div style="display:flex;gap:7px">
      <button type="button" onClick="{{gsOpen}}" aria-label="유약 고르기 · 지금 {{selGz.name}}" style="all:unset;cursor:pointer;flex:1 1 auto;min-width:0;box-sizing:border-box;display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:14px;background:#FFFDF5;border:3px solid #8A6440;box-shadow:0 3px 0 #8A6440">
        <span style="position:relative;flex:0 0 40px;height:40px;display:flex;align-items:center;justify-content:center"><img dc-src="{{selGz.img}}" alt="" aria-hidden="true" draggable="false" style="width:36px;height:40px;object-fit:contain"><span style="{{selGz.chip}}">{{selGz.chipText}}</span></span>
        <span style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px">
          <span style="font-family:'Jua',sans-serif;font-size:16px;color:#2B1A0F">{{selGz.name}}</span>
          <span style="font-size:10.5px;font-weight:700;color:#7A5434;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{selGz.okText}} · {{selGz.price}}</span>
          <span style="{{selGz.goalStyle}}">{{selGz.goal}}</span>
        </span>
        <span style="flex:0 0 auto;padding:3px 9px;border-radius:9px;background:#5B3A24;font-family:'Jua',sans-serif;font-size:12px;color:#FFE7A8">바꾸기 ▾</span>
      </button>
      <sc-if value="{{plumOn}}" hint-placeholder-val="{{false}}">
        <button type="button" onClick="{{plumTap}}" aria-pressed="{{plumPressed}}" style="{{plumStyle}}"><img src="_blob/b570ded58d448dba37db6e748cf57424.webp" alt="" aria-hidden="true" style="width:28px;height:28px;object-fit:contain"><span>매화 문양</span></button>
      </sc-if>
    </div>

    <button type="button" data-work="1" onPointerDown="{{holdStart}}" onPointerUp="{{holdEnd}}" onPointerLeave="{{holdEnd}}" onPointerCancel="{{holdEnd}}" onKeyDown="{{keyDown}}" onKeyUp="{{keyUp}}" onContextMenu="{{noMenu}}" style="{{holdStyle}}">
      <span style="font-family:'Jua',sans-serif;font-size:21px">{{holdLabel}}</span>
      <span style="font-size:10.5px;font-weight:700;opacity:.9">{{holdSub}}</span>
    </button>
  </div>

  <sc-if value="{{gsShow}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;left:0;top:0;width:390px;height:844px;z-index:70;background:rgba(26,15,8,.6);display:flex;align-items:flex-end">
      <div role="dialog" aria-label="유약 고르기" style="width:390px;max-height:640px;box-sizing:border-box;padding:16px 14px 18px;background:#FFF4DE;border-top:4px solid #5B3A24;border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0"><span style="font-family:'Jua',sans-serif;font-size:20px;color:#2B1A0F">유약 고르기</span><span style="font-size:11.5px;color:#7A5434">유약마다 알맞은 담금 시간이 다르다</span></div>
          <button type="button" onClick="{{gsClose}}" aria-label="닫기" style="all:unset;cursor:pointer;margin-left:auto;flex:0 0 42px;height:42px;box-sizing:border-box;border-radius:50%;background:#5B3A24;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:20px;color:#FFE7A8">✕</button>
        </div>
        <div style="flex:1 1 auto;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:2px">
          <sc-for list="{{glazes}}" as="z" hint-placeholder-count="4">
            <button type="button" onClick="{{z.pick}}" aria-pressed="{{z.on}}" aria-label="{{z.name}}" style="{{z.rowStyle}}">
              <span style="{{z.tagStyle}}">{{z.tag}}</span>
              <span style="position:relative;width:52px;height:52px;display:flex;align-items:center;justify-content:center"><img dc-src="{{z.img}}" alt="" aria-hidden="true" draggable="false" style="width:48px;height:52px;object-fit:contain"><span style="{{z.chip}}">{{z.chipText}}</span></span>
              <span style="font-family:'Jua',sans-serif;font-size:15px;color:#2B1A0F">{{z.name}}</span>
              <span style="font-size:10.5px;color:#7A5434;text-align:center">{{z.okText}} · {{z.price}}</span>
              <span style="{{z.goalStyle}}">{{z.goal}}</span>
            </button>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{toastOn}}" hint-placeholder-val="{{false}}">
    <div role="status" style="{{toastStyle}}">{{toast}}</div>
  </sc-if>


  <sc-if value="{{pk.on}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;left:0;top:0;width:390px;height:844px;z-index:60;background:rgba(26,15,8,.62);display:flex;align-items:flex-end">
      <div role="dialog" aria-label="{{pk.title}}" style="width:390px;max-height:660px;box-sizing:border-box;padding:16px 14px 18px;background:#FFF4DE;border-top:4px solid #5B3A24;border-radius:26px 26px 0 0;box-shadow:0 -6px 0 rgba(43,26,15,.25);display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0">
            <span style="font-family:'Jua',sans-serif;font-size:20px;color:#2B1A0F">{{pk.title}}</span>
            <span style="font-size:12px;color:#7A5434">{{pk.sub}}</span>
          </div>
          <button type="button" onClick="{{pk.close}}" aria-label="닫기" style="all:unset;cursor:pointer;margin-left:auto;flex:0 0 44px;height:44px;box-sizing:border-box;border-radius:50%;background:#5B3A24;border:3px solid #3E2616;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:18px;color:#FFE7A8">✕</button>
        </div>
        <div style="flex:1 1 auto;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:4px 2px 6px">
          <sc-for list="{{pk.rows}}" as="pr" hint-placeholder-count="4">
            <button type="button" onClick="{{pr.tap}}" aria-pressed="{{pr.on}}" style="{{pr.style}}">
              <span style="{{pr.checkStyle}}">{{pr.check}}</span>
              <svg width="84" height="84" viewBox="{{pr.pot.vb}}" aria-hidden="true"><ellipse cx="0" cy="{{pr.pot.shCy}}" rx="{{pr.pot.shRx}}" ry="{{pr.pot.shRy}}" fill="rgba(30,15,5,.26)"></ellipse><path d="{{pr.pot.d}}" fill="{{pr.pot.fill}}"></path><path d="{{pr.pot.d}}" fill="url(#potTopLight)"></path><path d="{{pr.pot.d}}" fill="{{pr.pot.rings}}"></path><path d="{{pr.pot.d}}" fill="#000" filter="url(#potGrain)" opacity="{{pr.pot.grainOp}}"></path><path d="{{pr.pot.d}}" fill="{{pr.pot.foot}}" fill-opacity="{{pr.pot.footOp}}" clip-path="url(#potFoot)"></path><path d="{{pr.pot.d}}" fill="{{pr.pot.drip}}" fill-opacity="{{pr.pot.dripOp}}" clip-path="url(#potDrip)"></path><path d="{{pr.pot.d}}" fill="url(#potShade)"></path><path d="{{pr.pot.d}}" fill="none" stroke="{{pr.pot.edge}}" stroke-width="{{pr.pot.sw}}" stroke-linejoin="round"></path><ellipse cx="0" cy="{{pr.pot.rimY}}" rx="{{pr.pot.rimRx}}" ry="{{pr.pot.rimRy}}" fill="{{pr.pot.inner}}" stroke="{{pr.pot.edge}}" stroke-width="{{pr.pot.sw}}"></ellipse></svg>
              <span style="font-family:'Jua',sans-serif;font-size:16px;color:#2B1A0F">{{pr.name}}</span>
              <span style="font-size:11px;color:#7A5434">{{pr.meta}}</span>
              <span style="{{pr.tagStyle}}">{{pr.tag}}</span>
            </button>
          </sc-for>
        </div>
        <sc-if value="{{pk.empty}}" hint-placeholder-val="{{false}}">
          <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 0">
            <span style="font-family:'Jua',sans-serif;font-size:15px;color:#7A5434">{{pk.emptyText}}</span>
            <a href="{{pk.emptyHref}}" style="font-family:'Jua',sans-serif;font-size:14px;color:#2F6328">{{pk.emptyLink}}</a>
          </div>
        </sc-if>
        <sc-if value="{{pk.multi}}" hint-placeholder-val="{{true}}">
          <button type="button" onClick="{{pk.confirm}}" style="{{pk.confirmStyle}}">{{pk.confirmLabel}}</button>
        </sc-if>
      </div>
    </div>
  </sc-if>
</div>
    </div>
  </div>
  <div aria-hidden="true" style="{{navDust}}">FX_DUST_LAND</div>
  <sc-if value="{{flyOn}}" hint-placeholder-val="{{false}}">
    <sc-for list="{{flyList}}" as="fl" hint-placeholder-count="1">
      <svg aria-hidden="true" viewBox="{{fl.vb}}" style="{{fl.style}}"><path d="{{fl.d}}" fill="{{fl.fill}}"></path><path d="{{fl.d}}" fill="url(#potTopLight)"></path><path d="{{fl.d}}" fill="{{fl.rings}}"></path><path d="{{fl.d}}" fill="{{fl.foot}}" fill-opacity="{{fl.footOp}}" clip-path="url(#potFoot)"></path><path d="{{fl.d}}" fill="{{fl.drip}}" fill-opacity="{{fl.dripOp}}" clip-path="url(#potDrip)"></path><path d="{{fl.d}}" fill="url(#potShade)"></path><path d="{{fl.d}}" fill="none" stroke="{{fl.edge}}" stroke-width="{{fl.sw}}" stroke-linejoin="round"></path><ellipse cx="0" cy="{{fl.rimY}}" rx="{{fl.rimRx}}" ry="{{fl.rimRy}}" fill="{{fl.inner}}" stroke="{{fl.edge}}" stroke-width="{{fl.sw}}"></ellipse></svg>
    </sc-for>
  </sc-if>
  <sc-if value="{{navPrevOn}}" hint-placeholder-val="{{true}}">
    <a href="{{navPrevHref}}" data-nav="prev" aria-label="이전 공정" style="position:absolute;left:2px;top:377px;width:54px;height:54px;z-index:20;box-sizing:border-box;border-radius:14px;background:#FFF4DE;border:2px solid #5B3A24;box-shadow:0 3px 0 #5B3A24;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-decoration:none;color:#5B3A24"><span style="font-family:'Jua',sans-serif;font-size:18px;line-height:1">◀</span><span style="font-family:'Jua',sans-serif;font-size:14px;line-height:1.2">{{navPrevName}}</span></a>
  </sc-if>
  <sc-if value="{{navNextOn}}" hint-placeholder-val="{{true}}">
    <a href="{{navNextHref}}" data-nav="next" aria-label="다음 공정" style="position:absolute;right:2px;top:377px;width:54px;height:54px;z-index:20;box-sizing:border-box;border-radius:14px;background:#FFF4DE;border:2px solid #5B3A24;box-shadow:0 3px 0 #5B3A24;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-decoration:none;color:#5B3A24"><span style="font-family:'Jua',sans-serif;font-size:18px;line-height:1">▶</span><span style="font-family:'Jua',sans-serif;font-size:14px;line-height:1.2">{{navNextName}}</span></a>
