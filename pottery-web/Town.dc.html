<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2B1A0F">
<title>마을 지도</title>
<script src="./support.js"></script>
<script src="./shared.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans KR',system-ui,sans-serif}
a{color:#5B3A24}a:hover{color:#3E2616}
@keyframes starPop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
@keyframes rise{0%{transform:translateY(30px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes glowP{0%,100%{box-shadow:0 0 0 3px #FFE7A8,0 0 10px rgba(255,214,107,.6)}50%{box-shadow:0 0 0 3px #FFE7A8,0 0 22px rgba(255,214,107,1)}}
</style>
</helmet>
<div style="position:relative;width:390px;height:844px;overflow:hidden;background:#BFD3A8;color:#2B1A0F">
  <img src="_blob/57d5d47faa750c3d56565c04e7ef2b97.webp" alt="" aria-hidden="true" draggable="false" style="position:absolute;left:-16px;top:0;width:422px;height:844px;pointer-events:none;user-select:none">
  <div style="position:absolute;left:12px;right:12px;top:12px;display:flex;align-items:center;gap:8px;z-index:5">
    <a href="Main.dc.html" aria-label="공방으로" style="flex:0 0 auto;width:42px;height:42px;box-sizing:border-box;border-radius:14px;background:#FFF4DE;border:3px solid #5B3A24;box-shadow:0 3px 0 #5B3A24;display:flex;align-items:center;justify-content:center;text-decoration:none;font-family:'Jua',sans-serif;font-size:20px;color:#5B3A24">‹</a>
    <div style="flex:1 1 auto;height:42px;display:flex;align-items:center;justify-content:center;background:#B9533A;clip-path:polygon(0 0,100% 0,95% 50%,100% 100%,0 100%,5% 50%);font-family:'Jua',sans-serif;font-size:19px;color:#FFF4DE;text-shadow:0 2px 0 #7A2F1E">마을 지도</div>
    <span style="flex:0 0 auto;padding:5px 12px;border-radius:14px;background:rgba(43,26,15,.85);border:2px solid #3E2616;font-family:'Jua',sans-serif;font-size:14px;color:#FFE7A8">{{gold}}G</span>
  </div>

  <sc-for list="{{spots}}" as="sp" hint-placeholder-count="5">
    <button type="button" onClick="{{sp.tap}}" aria-label="{{sp.aria}}" style="{{sp.box}}">
      <span style="{{sp.bldg}}"><span aria-hidden="true" style="font-size:40px;line-height:1">{{sp.ic}}</span></span>
      <span style="{{sp.plate}}">{{sp.name}}</span>
      <span style="{{sp.chip}}">{{sp.status}}</span>
    </button>
  </sc-for>

  <sc-if value="{{det.on}}" hint-placeholder-val="{{false}}">
    <div style="position:absolute;left:0;top:0;width:390px;height:844px;z-index:40;background:rgba(26,15,8,.55);display:flex;align-items:flex-end">
      <div role="dialog" aria-label="{{det.name}}" style="width:390px;max-height:720px;overflow-y:auto;box-sizing:border-box;padding:16px 16px 22px;background:#FFF4DE;border-top:4px solid #5B3A24;border-radius:26px 26px 0 0;display:flex;flex-direction:column;gap:10px;animation:rise .2s ease-out">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-family:'Jua',sans-serif;font-size:22px">{{det.name}}</span>
          <span style="{{det.stStyle}}">{{det.status}}</span>
          <button type="button" onClick="{{det.close}}" aria-label="닫기" style="all:unset;cursor:pointer;margin-left:auto;width:42px;height:42px;box-sizing:border-box;border-radius:50%;background:#5B3A24;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:17px;color:#FFE7A8">✕</button>
        </div>
        <div style="height:120px;box-sizing:border-box;border:2px dashed #7A5434;border-radius:14px;background:{{det.bg}};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#3E2616"><span aria-hidden="true" style="font-size:56px;line-height:1">{{det.ic}}</span></div>
        <span style="font-size:12.5px;line-height:1.6;color:#5B3A24">{{det.desc}}</span>
        <div style="display:flex;flex-direction:column;gap:5px">
          <span style="font-family:'Jua',sans-serif;font-size:14px">이 동네가 좋아하는 스타일</span>
          <div style="display:flex;flex-wrap:wrap;gap:5px">
            <sc-for list="{{det.likes}}" as="lk" hint-placeholder-count="3">
              <span style="padding:3px 10px;border-radius:10px;background:#EAF5E4;border:2px solid #3B7A32;font-family:'Jua',sans-serif;font-size:12.5px;color:#2F6328">{{lk}}</span>
            </sc-for>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <span style="font-family:'Jua',sans-serif;font-size:14px">찾아오는 손님</span>
          <div style="display:flex;gap:6px">
            <sc-for list="{{det.guests}}" as="gu" hint-placeholder-count="3">
              <span style="flex:1 1 0;height:74px;box-sizing:border-box;border:2px dashed #8A6440;border-radius:12px;background:#F3E3C4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;text-align:center"><span aria-hidden="true" style="font-size:26px;line-height:1">🧑</span><span style="font-family:'Jua',sans-serif;font-size:12px;color:#2B1A0F">{{gu.name}}</span></span>
            </sc-for>
          </div>
        </div>
        <div style="padding:10px 12px;border-radius:14px;background:#EDE3F3;border:2px solid #7A5A93;display:flex;flex-direction:column;gap:3px">
          <span style="font-family:'Jua',sans-serif;font-size:14px;color:#4A3460">{{det.storyTitle}}</span>
          <span style="font-size:12px;line-height:1.5;color:#4A3460">{{det.story}}</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:3px;padding:8px 12px;border-radius:12px;background:#F3E3C4">
          <sc-for list="{{det.perks}}" as="pk2" hint-placeholder-count="3">
            <span style="font-size:12px;font-weight:700;color:#5B3A24">· {{pk2}}</span>
          </sc-for>
        </div>
        <button type="button" onClick="{{det.go}}" style="{{det.goStyle}}">{{det.goLabel}}</button>
      </div>
    </div>
  </sc-if>

  <nav aria-label="주 메뉴" style="position:absolute;left:0;bottom:0;width:390px;height:92px;box-sizing:border-box;padding:0 6px 8px;background:#6B4429;border-top:4px solid #3E2616;box-shadow:inset 0 3px 0 #8A5A36;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end">
    <a href="Main.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;text-decoration:none">
      <img src="_blob/4d235f31faacd07e94182c72c545cfea.webp" alt="" aria-hidden="true" style="width:40px;height:40px;object-fit:contain">
      <span style="font-family:'Jua',sans-serif;font-size:12px;white-space:nowrap;color:#F6E7CC">공방</span>
    </a>
    <a href="Gather.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;text-decoration:none">
      <img src="_blob/976713d77fcd910c2063a318370be110.webp" alt="" aria-hidden="true" style="width:40px;height:40px;object-fit:contain">
      <span style="font-family:'Jua',sans-serif;font-size:12px;white-space:nowrap;color:#F6E7CC">채집</span>
    </a>
    <a href="Wheel.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;margin-top:-28px">
      <span style="width:70px;height:70px;box-sizing:border-box;border-radius:50%;background:#3B7A32;border:4px solid #2F6328;box-shadow:0 4px 0 #2F6328,inset 0 3px 0 #6DB35E;display:flex;align-items:center;justify-content:center">
        <img src="_blob/57df2cdf4d037636e8c5fa366b12ec35.webp" alt="" aria-hidden="true" style="width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))">
      </span>
      <span style="font-family:'Jua',sans-serif;font-size:13px;color:#F6E7CC">제작</span>
    </a>
    <a href="Commission.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;text-decoration:none">
      <img src="_blob/e3f790ef5b7c6af4d706b063f909ab46.webp" alt="" aria-hidden="true" style="width:40px;height:40px;object-fit:contain">
      <span style="font-family:'Jua',sans-serif;font-size:12px;white-space:nowrap;color:#F6E7CC">의뢰</span>
    </a>
    <a href="Shop.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;text-decoration:none">
      <img src="_blob/06f86a4df741dc544193607cfb80c2fb.webp" alt="" aria-hidden="true" style="width:40px;height:40px;object-fit:contain">
      <span style="font-family:'Jua',sans-serif;font-size:12px;white-space:nowrap;color:#F6E7CC">상점</span>
    </a>
  </nav>
  <sc-if value="{{toastOn}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position:absolute;left:30px;right:30px;top:300px;z-index:90;padding:12px 14px;border-radius:16px;background:rgba(43,26,15,.92);border:3px solid #FFE7A8;font-family:'Jua',sans-serif;font-size:14px;color:#FFF4DE;text-align:center;pointer-events:none">{{toast}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { g: this.loadG(), det: '', toast: '' }; }
  loadG() {
    var d = { gold: 1240, shards: 142, fameLv: 3, fameXp: 62, pieces: {}, order: [], shapesFound: {}, glazesFound: {}, deco: {}, mats: {} };
    try { var r = localStorage.getItem('pottery-proto-v1'); if (r) { var o = JSON.parse(r); for (var k in o) { d[k] = o[k]; } } } catch (e) {}
    return d;
  }
  setG(p) {
    var c = this.loadG(), g = {};
    for (var k in c) { g[k] = c[k]; }
    for (var j in p) { g[j] = p[j]; }
    try { localStorage.setItem('pottery-proto-v1', JSON.stringify(g)); } catch (e) {}
    this.setState({ g: g });
  }
  tutBoot() { return window.PotteryShared.tutBoot.call(this, 'Town'); }
  sndBoot() { return window.PotteryShared.sndBoot.call(this); }
  qlib() { return window.PotteryShared.qlib.call(this); }
  navBoot() { return window.PotteryShared.navBoot.call(this); }
  trackBoot() { return window.PotteryShared.trackBoot.call(this); }
  componentDidMount() {
    try { this.tutBoot(); } catch (e) {}
    try { this.sndBoot(); } catch (e) {}
    var selfB = this; setTimeout(function () { try { selfB.navBoot(); } catch (e) {} }, 0);
    var self = this;
    this.onStore = function (e) { if (!e || e.key === 'pottery-proto-v1' || e.key === null) { self.setState({ g: self.loadG() }); } };
    try { window.addEventListener('storage', this.onStore); } catch (e) {}
  }
  componentWillUnmount() { clearTimeout(this.tt); try { window.removeEventListener('storage', this.onStore); } catch (e) {} }
  say(m) { var self = this; clearTimeout(this.tt); this.setState({ toast: m }); this.tt = setTimeout(function () { self.setState({ toast: '' }); }, 2000); }

  data() {
    return [
      { id: 'home', name: '공방 골목', res: 'OBJ_TOWN_HOME', x: 35, y: 135, lv: 1, cost: 0, base: true, bg: '#EADBC0', desc: '할머니의 공방이 있는 오래된 골목. 모든 이야기가 여기서 시작돼요.', likes: ['찻잔', '사발', '종지'], guests: [['CHAR_MIN', '민 씨'], ['CHAR_WALK_D', '동네 할머니'], ['CHAR_CAFE', '카페 사장']], storyTitle: '에피소드 1 · 강 할매네 공방', story: '정리하러 왔던 공방에 손님이 다시 찾아와요', perks: ['기본 손님 방문', '의뢰 내역서'] },
      { id: 'market', name: '오일장 매점', res: 'OBJ_TOWN_MARKET', x: 245, y: 205, lv: 3, cost: 5000, soon: true, bg: '#F2D7A6', desc: '닷새마다 장이 서는 마을 장터. 튼튼하고 값싼 생활 그릇이 잘 팔려요.', likes: ['사발', '백자', '양작 이상'], guests: [['CHAR_MKT_A', '국밥집 사장'], ['CHAR_MKT_B', '새댁'], ['CHAR_MKT_C', '장돌뱅이']], storyTitle: '윤 할매 챕터 뒤 · 장날의 그릇', story: '가게를 이어받은 윤 할매 손주가 장터에도 국밥 자리를 내요', perks: ['매점 진열 3칸 추가', '선호 스타일 판매가 +30%', '장날(5일마다) 손님 2배'] },
      { id: 'temple', name: '산사 다실', res: 'OBJ_TOWN_TEMPLE', x: 50, y: 345, lv: 5, cost: 15000, soon: true, bg: '#D9E4CF', desc: '산 중턱 절의 작은 다실. 스님과 다인들이 고요한 찻그릇을 찾아요.', likes: ['다완', '청자', '흑유'], guests: [['CHAR_TMP_A', '주지 스님'], ['CHAR_TMP_B', '다인'], ['CHAR_TMP_C', '순례자']], storyTitle: '차 선생 챕터 뒤 · 고요한 찻자리', story: '차 선생이 강 선생님과 다니던 산사 다실을 소개해 줘요', perks: ['매점 진열 3칸 추가', '다완·청자 판매가 +40%', '스테이지 「산사」 분류 해금'] },
      { id: 'harbor', name: '항구 매점', res: 'OBJ_TOWN_HARBOR', x: 95, y: 612, lv: 5, cost: 20000, soon: true, bg: '#CFDCE8', desc: '바다 건너 손님이 드나드는 항구. 크고 튼튼한 항아리가 배에 실려요.', likes: ['항아리', '흑유', '대형'], guests: [['CHAR_HBR_A', '무역상'], ['CHAR_HBR_B', '선장'], ['CHAR_HBR_C', '외국 수집가']], storyTitle: '정윤 챕터 뒤 · 바다를 건너는 그릇', story: '정윤의 전시를 본 외국 수집가가 공방을 찾아와요', perks: ['대량 납품 해금', '항아리 판매가 +40%', '스테이지 「항구」 분류 해금'] },
      { id: 'gallery', name: '미술관 거리', res: 'OBJ_TOWN_GALLERY', x: 210, y: 465, lv: 9, cost: 0, soon: true, bg: '#EDE3F3', desc: '도시의 갤러리와 미술관이 모인 거리. 명작 이상만 다뤄요.', likes: ['명작 이상', '요변'], guests: [['CHAR_CURATOR', '큐레이터'], ['CHAR_GAL_A', '평론가'], ['CHAR_GAL_B', '컬렉터']], storyTitle: '에피소드 1 이후 · 이름을 남기다', story: '새 간판을 단 공방의 이름이 도시까지 알려져요', perks: ['경매 해금 (예정)', '개인전 개최 (예정)'] }
    ];
  }
  renderVals() {
    var self = this, s = this.state, g = s.g, D = this.data(), open = g.townOpen || {};
    function stat(d) {
      if (d.base || open[d.id]) { return ['영업 중', 'open']; }
      // 구역은 단골 챕터를 마치면 열린다 (에피소드 1 · 윤 할매 → 오일장 · 차 선생 → 산사 다실 · 정윤 → 항구 · 장 씨 → 미술관 거리)
      var CHN = { market: ['yoon', '윤 할매'], temple: ['cha', '차 선생'], harbor: ['jeong', '정윤'], gallery: ['jang', '장 씨 할아버지'] }[d.id];
      if (CHN && !self.qlib().npcProg(g, CHN[0]).end) { return [CHN[1] + ' 챕터를 마치면 열려요', 'lock', CHN[1] + ' 챕터 후']; }
      return ['구역 열림', 'open'];
    }
    var TIC = { home: '🏡', market: '🏪', temple: '🍵', harbor: '⚓', gallery: '🖼️' };
    var spots = D.map(function (d) {
      var st = stat(d);
      return {
        name: d.name, res: d.res, ic: TIC[d.id] || '🏠', status: st[2] || st[0], aria: d.name + ' · ' + st[0],
        box: 'all:unset;cursor:pointer;position:absolute;left:' + d.x + 'px;top:' + d.y + 'px;width:110px;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2',
        bldg: 'width:100px;height:90px;box-sizing:border-box;border:3px dashed ' + (st[1] === 'lock' || st[1] === 'soon' ? '#7E7466' : '#3E2616') + ';border-radius:14px 14px 6px 6px;background:' + (st[1] === 'lock' || st[1] === 'soon' ? 'rgba(120,110,100,.45)' : d.bg) + ';display:flex;flex-direction:column;align-items:center;justify-content:center;color:#3E2616;' + (st[1] === 'ready' ? 'animation:glowP 1.6s ease-in-out infinite;' : ''),
        plate: 'padding:2px 10px;border-radius:9px;background:#5B3A24;border:2px solid #3E2616;font-family:Jua,sans-serif;font-size:13px;color:#FFE7A8;white-space:nowrap',
        chip: 'padding:1px 8px;border-radius:8px;font-family:Jua,sans-serif;font-size:11px;white-space:nowrap;' + (st[1] === 'open' ? 'background:#3B7A32;color:#FFFDF5' : (st[1] === 'ready' ? 'background:#E3B23C;color:#2B1A0F' : (st[1] === 'soon' ? 'background:#7A5A93;color:#FFFDF5' : 'background:#3E2616;color:#E8D3B5'))),
        tap: function () { self.setState({ det: d.id }); }
      };
    });
    var det = { on: false };
    var d = D.filter(function (x) { return x.id === s.det; })[0];
    if (d) {
      var st = stat(d);
      det = {
        on: true, name: d.name, status: st[0], desc: d.desc, likes: d.likes, bg: d.bg, ic: TIC[d.id] || '🏠',
        guests: d.guests.map(function (x) { return { res: x[0], name: x[1] }; }),
        storyTitle: d.storyTitle, story: d.story, perks: d.perks,
        stStyle: 'padding:2px 9px;border-radius:9px;font-family:Jua,sans-serif;font-size:12px;' + (st[1] === 'open' ? 'background:#3B7A32;color:#FFFDF5' : (st[1] === 'ready' ? 'background:#E3B23C;color:#2B1A0F' : 'background:#5B3A24;color:#FFE7A8')),
        goLabel: st[1] === 'open' ? (d.base ? '공방으로 가기' : '구역 열림 · 매점은 다음 업데이트') : (st[1] === 'ready' ? '매점 열기 · ' + d.cost.toLocaleString() + 'G' : (st[1] === 'soon' ? '다음 업데이트에서 열려요' : st[0])),
        goStyle: 'all:unset;cursor:pointer;box-sizing:border-box;text-align:center;padding:13px 0;border-radius:18px;font-family:Jua,sans-serif;font-size:18px;' + (st[1] === 'ready' || (st[1] === 'open' && d.base) ? 'background:#3B7A32;border:3px solid #2F6328;box-shadow:0 4px 0 #2F6328;color:#FFFDF5' : 'background:#CFC5B4;border:3px solid #8E8473;color:#5E5547'),
        go: function () {
          if (st[1] === 'ready') {
            if (g.gold < d.cost) { self.say('골드가 ' + (d.cost - g.gold).toLocaleString() + ' 부족해요'); return; }
            var o = {}; for (var k in open) { o[k] = open[k]; } o[d.id] = true;
            self.setG({ gold: g.gold - d.cost, townOpen: o });
            self.say(d.name + ' 개점 · ' + d.storyTitle + ' 시작');
          } else if (st[1] === 'open' && d.base) { self.say('공방 골목은 지금 있는 곳이에요'); }
          else { self.say(st[1] === 'soon' ? '다음 업데이트에서 열려요' : (st[1] === 'open' ? '매점 관리는 곧 열려요' : st[0])); }
        },
        close: function () { self.setState({ det: '' }); }
      };
    }
    return { gold: (g.gold || 0).toLocaleString(), spots: spots, det: det, toast: s.toast, toastOn: s.toast !== '' };
  }
}
</script>
</body>
</html>
