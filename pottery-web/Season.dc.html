    setInterval(function () {
      upd();
      var g = load();
      if ((g.gold || 0) > (prev.gold || 0)) { window.__sfx('coin'); }
      if ((g.jade || 0) < (prev.jade || 0)) { window.__sfx('jade'); }
      if (typeof g.tut === 'number' && typeof prev.tut === 'number' && g.tut > prev.tut) { window.__sfx('unlock'); }
      prev = g;
    }, 300);
  }
  componentDidMount() {
    try { this.tutBoot(); } catch (e) {}
    try { this.sndBoot(); } catch (e) {}
    var self = this;
    this.onStore = function (e) { if (!e || e.key === 'pottery-proto-v1' || e.key === null) { self.setState({ g: self.loadG() }); } };
    try { window.addEventListener('storage', this.onStore); } catch (e) {}
  }
  componentWillUnmount() { clearTimeout(this.tt); try { window.removeEventListener('storage', this.onStore); } catch (e) {} }
  say(m) { var self = this; clearTimeout(this.tt); this.setState({ toast: m }); this.tt = setTimeout(function () { self.setState({ toast: '' }); }, 2000); }

  renderVals() {
    var self = this, s = this.state, g = s.g;
    var sea = g.season || { petals: 25, claimed: {}, bought: {} };
    var day = new Date().toDateString();
    var soldN = 0; if (g.soldDay === day) { for (var k in (g.soldBy || {})) { soldN += g.soldBy[k]; } }
    var rec = (g.contest || {}).stars || {}, springStars = (rec.s1 || 0) + (rec.s2 || 0);
    var shelf = 0; for (var k2 in (g.pieces || {})) { if (g.pieces[k2].where === 'shelf') { shelf++; } }
    function save(p) { var n = { petals: sea.petals, claimed: sea.claimed || {}, bought: sea.bought || {} }; for (var x in p) { n[x] = p[x]; } return n; }
    var M = [
      { id: 'm1', name: '오늘 작품 3점 판매하기', cur: soldN, max: 3, reward: 10 },
      { id: 'm2', name: '시즌 스테이지 별 3개', cur: springStars, max: 3, reward: 20 },
      { id: 'm3', name: '진열대 6칸 가득 채우기', cur: shelf, max: 6, reward: 10 }
    ];
    var missions = M.map(function (m) {
      var done = m.cur >= m.max, got = !!(sea.claimed || {})[m.id];
      return {
        name: m.name, prog: Math.min(m.cur, m.max) + '/' + m.max,
        bar: 'height:100%;border-radius:4px;background:#D46A86;width:' + Math.min(100, m.cur / m.max * 100) + '%',
        btnLabel: got ? '받음' : '+' + m.reward,
        btn: 'all:unset;cursor:pointer;flex:0 0 56px;box-sizing:border-box;text-align:center;padding:6px 0;border-radius:11px;font-family:Jua,sans-serif;font-size:13px;' + (got ? 'background:#EBDDE0;color:#A08890;border:2px solid #D8C3C8' : (done ? 'background:#D46A86;color:#FFF;border:2px solid #A94767;box-shadow:0 2px 0 #A94767' : 'background:#FFF8F5;color:#C9A0AB;border:2px solid #E6C3CC')),
        claim: function () {
          if (got) { return; }
          if (!done) { self.say('아직 조건을 채우지 못했다 · ' + Math.min(m.cur, m.max) + '/' + m.max); return; }
          var c = {}; for (var x in (sea.claimed || {})) { c[x] = sea.claimed[x]; } c[m.id] = true;
          self.setG({ season: save({ petals: sea.petals + m.reward, claimed: c }) });
          self.say('꽃잎 +' + m.reward);
        }
      };
    });
    var I = [
      { id: 'sakura', name: '벚꽃유', kind: '한정 유약', res: 'GLZ_SAKURA', img: '_blob/9dfa7034fc62a520ec428f5b3bdebc0b.webp', price: 30, col: '#F4B6C4', apply: function (p) { var gf = {}; for (var x in (g.glazesFound || {})) { gf[x] = g.glazesFound[x]; } gf.sakura = true; p.glazesFound = gf; } },
      { id: 'plum', name: '매화 문양', kind: '한정 문양', res: 'PTN_PLUM', img: '_blob/b570ded58d448dba37db6e748cf57424.webp', price: 20, col: '#FCEBD8', apply: function (p) { var pt = {}; for (var x in (g.patterns || {})) { pt[x] = g.patterns[x]; } pt.plum = true; p.patterns = pt; } },
      { id: 'teabed', name: '다회 평상', kind: '한정 가구', res: 'DECO_TEABED', img: '_blob/7480af1a2e3666be0fe08ab90f2616f2.webp', price: 40, col: '#E8D5B7', apply: function (p) { var d = {}; for (var x in (g.deco || {})) { d[x] = g.deco[x]; } d.teabed = true; p.deco = d; } },
      { id: 'lantern', name: '꽃 등롱', kind: '한정 가구', res: 'DECO_FLOWER_LAMP', img: '_blob/0ddf322aaf48ab6e1f34af33fbd75920.webp', price: 15, col: '#FFE7A8', apply: function (p) { var d = {}; for (var x in (g.deco || {})) { d[x] = g.deco[x]; } d.flowerlamp = true; p.deco = d; } },
      { id: 'clay', name: '봄빛 흙 ×3', kind: '한정 재료', res: 'MAT_SPRING_CLAY', img: '_blob/dcdb71e502660d3f3806e3ace6a3eeba.webp', price: 25, col: '#F2D7C9', apply: function (p) { var m = {}; for (var x in (g.mats || {})) { m[x] = g.mats[x]; } m.spring = (m.spring || 0) + 3; p.mats = m; } },
      { id: 'invite', name: '다회 초대장', kind: '특별 손님', res: 'ITEM_INVITE', img: '_blob/efb9f0de474660761633b5ce70321809.webp', price: 35, col: '#EDE3F3', apply: function (p) { p.inviteGuest = true; } }
    ];
    var items = I.map(function (it) {
      var got = !!(sea.bought || {})[it.id], afford = sea.petals >= it.price;
      return {
        name: it.name, kind: it.kind, res: it.res, img: it.img, aria: it.name + ' · 꽃잎 ' + it.price + (got ? ' · 구매 완료' : ''),
        price: got ? '구매 완료' : '꽃잎 ' + it.price,
        card: 'all:unset;cursor:pointer;position:relative;aspect-ratio:1 / 1.25;box-sizing:border-box;padding:8px 4px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;' + (got ? 'background:#EFE6E8;border:3px solid #D8C3C8;opacity:.75' : 'background:#FFF8F5;border:3px solid #D46A86;box-shadow:0 3px 0 #A94767'),
        kindStyle: 'position:absolute;left:5px;top:5px;padding:0 5px;border-radius:6px;background:#7A2F44;font-size:9px;font-weight:700;color:#FFE7EE',
        icon: 'margin-top:8px;width:54px;height:54px;box-sizing:border-box;border:2px solid rgba(91,58,36,.25);border-radius:12px;background:' + it.col + ';display:flex;align-items:center;justify-content:center;text-align:center;color:#7A2F44',
        priceStyle: 'padding:1px 8px;border-radius:8px;font-family:Jua,sans-serif;font-size:11.5px;' + (got ? 'background:#D8C3C8;color:#FFF' : (afford ? 'background:#D46A86;color:#FFF' : 'background:#F1D5DC;color:#A94767')),
        buy: function () {
          if (got) { self.say('이미 가지고 있다'); return; }
          if (!afford) { self.say('꽃잎이 ' + (it.price - sea.petals) + '장 부족하다 · 축제 미션으로 모으자'); return; }
          var b = {}; for (var x in (sea.bought || {})) { b[x] = sea.bought[x]; } b[it.id] = true;
          var p = { season: save({ petals: sea.petals - it.price, bought: b }) };
          it.apply(p);
          self.setG(p);
          self.say(it.name + ' 획득 · ' + it.kind);
        }
      };
    });
    return {
      petals: sea.petals, dday: Math.max(0, Math.ceil((new Date('2026-11-17T00:00:00+09:00') - Date.now()) / 86400000)),
      missions: missions, items: items, toast: s.toast, toastOn: s.toast !== ''
    };
  }
}
</script>
