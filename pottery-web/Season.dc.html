  <div style="position:absolute;left:12px;right:12px;top:192px;bottom:100px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-bottom:6px">
    <div style="box-sizing:border-box;padding:10px 12px;border-radius:16px;background:#FFF8F5;border:3px solid #A94767;display:flex;flex-direction:column;gap:7px">
      <div style="display:flex;align-items:center;justify-content:space-between"><span style="font-family:'Jua',sans-serif;font-size:15px;color:#7A2F44">축제 미션 · 꽃잎 모으기</span><a href="Counter.dc.html" onClick="{{goSeasonStage}}" style="display:inline-flex;align-items:center;min-height:36px;padding:0 6px;margin-right:-6px;font-family:'Jua',sans-serif;font-size:13px;color:#8E3556;text-decoration:none">시즌 의뢰 →</a></div>
      <sc-for list="{{missions}}" as="ms" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:8px">
          <div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px">
            <span style="font-size:12.5px;font-weight:700;color:#3E2616">{{ms.name}}</span>
            <div style="height:8px;border-radius:4px;background:#F1D5DC;overflow:hidden"><div style="{{ms.bar}}"></div></div>

      <div style="display:flex;align-items:center;justify-content:space-between"><span style="font-family:'Jua',sans-serif;font-size:15px;color:#7A2F44">꽃잎 사기</span><span style="font-size:11.5px;font-weight:700;color:#7A2F44">보유 💎 {{jade}}</span></div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
        <sc-for list="{{packs}}" as="pk" hint-placeholder-count="3">
          <button type="button" onClick="{{pk.ask}}" aria-label="{{pk.aria}}" style="all:unset;cursor:pointer;box-sizing:border-box;min-height:58px;padding:6px 4px;border-radius:14px;background:#FFF;border:2.5px solid #D46A86;box-shadow:0 3px 0 #A94767;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px">
            <span style="font-family:'Jua',sans-serif;font-size:15px;color:#7A2F44">🌸 {{pk.n}}</span>
            <span style="font-size:12px;font-weight:700;color:#1E5E48">💎 {{pk.price}}</span>
          </button>
        </sc-for>
      </div>
    </div>

    <div style="display:flex;align-items:center;justify-content:space-between"><span style="font-family:'Jua',sans-serif;font-size:16px;color:#7A2F44">시즌 한정 상점</span><span style="font-size:11px;color:#7A2F44">시즌 종료 후 판매 종료 · 내년 복각 예정</span></div>
    <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px">
      <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
        <button type="button" onClick="{{it.buy}}" aria-label="{{it.aria}}" style="{{it.card}}">
          <span style="{{it.kindStyle}}">{{it.kind}}</span>
          <span style="{{it.icon}}"><sc-if value="{{it.imgOn}}" hint-placeholder-val="{{true}}"><img dc-src="{{it.img}}" alt="" aria-hidden="true" style="width:86%;height:86%;object-fit:contain"></sc-if><sc-if value="{{it.emojiOn}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="font-size:30px;line-height:1">{{it.emoji}}</span></sc-if></span>
          <span style="font-family:'Jua',sans-serif;font-size:12.5px;color:#2B1A0F;line-height:1.15;text-align:center">{{it.name}}</span>
          <span style="{{it.priceStyle}}">{{it.price}}</span>
        </button>
      </sc-for>
    </div>
  </div>

  <nav aria-label="주 메뉴" style="position:absolute;left:0;bottom:0;width:390px;height:92px;box-sizing:border-box;padding:0 6px 8px;background:#6B4429;border-top:4px solid #3E2616;box-shadow:inset 0 3px 0 #8A5A36;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end">
    <a href="Main.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;text-decoration:none">
      <img src="_blob/4d235f31faacd07e94182c72c545cfea.webp" alt="" aria-hidden="true" style="width:40px;height:40px;object-fit:contain">
      <span style="font-family:'Jua',sans-serif;font-size:12px;white-space:nowrap;color:#F6E7CC">공방</span>
    </a>
    <a href="Gather.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;text-decoration:none">
      <img src="_blob/976713d77fcd910c2063a318370be110.webp" alt="" aria-hidden="true" style="width:40px;height:40px;object-fit:contain">
      <span style="font-family:'Jua',sans-serif;font-size:12px;white-space:nowrap;color:#F6E7CC">채집</span>
    </a>
    <a href="Wheel.dc.html" style="display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;margin-top:-28px">
      <span style="width:70px;height:70px;box-sizing:border-box;border-radius:50%;background:#4A9440;border:4px solid #2F6328;box-shadow:0 4px 0 #2F6328,inset 0 3px 0 #6DB35E;display:flex;align-items:center;justify-content:center">
        <img src="_blob/57df2cdf4d037636e8c5fa366b12ec35.webp" alt="" aria-hidden="true" style="width:56px;height:56px;object-fit:contain;filter:drop-shadow(0 2px 1px rgba(0,0,0,.35))">
      </span>
      <span style="font-family:'Jua',sans-serif;font-size:13px;color:#F6E7CC">제작</span>
    </a>
    <a href="Commission.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;text-decoration:none">
      <img src="_blob/e3f790ef5b7c6af4d706b063f909ab46.webp" alt="" aria-hidden="true" style="width:40px;height:40px;object-fit:contain">
      <span style="font-family:'Jua',sans-serif;font-size:12px;white-space:nowrap;color:#F6E7CC">의뢰</span>
    </a>
    <a href="Shop.dc.html" style="position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;border-radius:12px;text-decoration:none">
      <img src="_blob/06f86a4df741dc544193607cfb80c2fb.webp" alt="" aria-hidden="true" style="width:40px;height:40px;object-fit:contain">
      <span style="font-family:'Jua',sans-serif;font-size:12px;white-space:nowrap;color:#F6E7CC">상점</span>
    </a>
  </nav>
  <sc-if value="{{askOn}}" hint-placeholder-val="{{false}}">
    <div onClick="{{askBg}}" style="position:absolute;inset:0;z-index:80;background:rgba(26,15,8,.62);display:flex;align-items:center;justify-content:center">
      <div role="dialog" aria-label="옥으로 꽃잎 사기" style="width:300px;box-sizing:border-box;padding:20px 18px 16px;border-radius:22px;background:#FFF4DE;border:4px solid #5B3A24;text-align:center;color:#2B1A0F">
        <div style="font-size:38px;line-height:1">🌸</div>
        <div style="margin:6px 0 4px;font-family:'Jua',sans-serif;font-size:20px">꽃잎 {{ask.n}}장을 살까요?</div>
        <div style="margin:10px 0 4px;padding:10px;border-radius:14px;background:#E6F6EF;border:2px solid #9ED9C0;font-family:'Jua',sans-serif;font-size:18px;color:#1E5E48">💎 옥 {{ask.price}}</div>
        <div style="font-size:11.5px;color:#7A5434;margin-bottom:12px">보유 {{jade}} → {{ask.after}}</div>
        <div style="display:flex;gap:8px">
          <button type="button" onClick="{{askNo}}" style="all:unset;cursor:pointer;flex:1;padding:12px 0;border-radius:14px;border:3px solid #8A6440;color:#5B3A24;font-family:'Jua',sans-serif;font-size:16px">취소</button>
          <button type="button" onClick="{{askYes}}" style="all:unset;cursor:pointer;flex:1.3;padding:12px 0;border-radius:14px;background:linear-gradient(#5CC9A2,#2F9A75);border:3px solid #1E5E48;box-shadow:0 4px 0 #1E5E48;color:#FFFDF5;font-family:'Jua',sans-serif;font-size:16px">사기</button>
        </div>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{toastOn}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position:absolute;left:30px;right:30px;top:300px;z-index:90;padding:12px 14px;border-radius:16px;background:rgba(43,26,15,.92);border:3px solid #FFE7A8;font-family:'Jua',sans-serif;font-size:14px;color:#FFF4DE;text-align:center;pointer-events:none">{{toast}}</div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { g: this.loadG(), toast: '' }; }
  loadG() {
    var d = { gold: 1240, shards: 142, fameLv: 3, fameXp: 62, pieces: {}, order: [], shapesFound: {}, glazesFound: {}, deco: {}, mats: {} };
    try { var r = localStorage.getItem('pottery-proto-v1'); if (r) { var o = JSON.parse(r); for (var k in o) { d[k] = o[k]; } } } catch (e) {}
    return d;
  }
  setG(p) {
    var c = this.loadG(), g = {};
    for (var k in c) { g[k] = c[k]; }
    for (var j in p) { g[j] = p[j]; }
    try { localStorage.setItem('pottery-proto-v1', JSON.stringify(g)); } catch (e) {}
    this.setState({ g: g });
  }
  tutBoot() { return window.PotteryShared.tutBoot.call(this, 'Season'); }
  sndBoot() { return window.PotteryShared.sndBoot.call(this); }
  qlib() { return window.PotteryShared.qlib.call(this); }
  navBoot() { return window.PotteryShared.navBoot.call(this); }
  trackBoot() { return window.PotteryShared.trackBoot.call(this); }
  componentDidMount() {
    try { this.tutBoot(); } catch (e) {}
    try { this.sndBoot(); } catch (e) {}
    var selfB = this; setTimeout(function () { try { selfB.navBoot(); } catch (e) {} }, 0);
    var self = this;
    this.onStore = function (e) { if (!e || e.key === 'pottery-proto-v1' || e.key === null) { self.setState({ g: self.loadG() }); } };
    try { window.addEventListener('storage', this.onStore); } catch (e) {}
  }
  componentWillUnmount() { clearTimeout(this.tt); try { window.removeEventListener('storage', this.onStore); } catch (e) {} }
  jadeOf(g) { return g.jadeV === 2 && g.jade != null ? g.jade : 1000000; }
  say(m) { var self = this; clearTimeout(this.tt); this.setState({ toast: m }); this.tt = setTimeout(function () { self.setState({ toast: '' }); }, 2000); }

  renderVals() {
    var self = this, s = this.state, g = s.g;
    var sea = g.season || { petals: 25, claimed: {}, bought: {} };
    var day = new Date().toDateString();
    var soldN = 0; if (g.soldDay === day) { for (var k in (g.soldBy || {})) { soldN += g.soldBy[k]; } }
    var rec = (g.contest || {}).stars || {}, springStars = (rec.s1 || 0) + (rec.s2 || 0);
    var shelf = 0; for (var k2 in (g.pieces || {})) { if (g.pieces[k2].where === 'shelf') { shelf++; } }
    function save(p) { var n = { petals: sea.petals, claimed: sea.claimed || {}, bought: sea.bought || {} }; for (var x in p) { n[x] = p[x]; } return n; }
    var M = [
      { id: 'm1', name: '오늘 작품 3점 판매하기', cur: soldN, max: 3, reward: 10 },
      { id: 'm2', name: '시즌 스테이지 별 3개', cur: springStars, max: 3, reward: 20 },
      { id: 'm3', name: '진열대 6칸 가득 채우기', cur: shelf, max: 6, reward: 10 }
    ];
    var jade = this.jadeOf(g);
    var packs = [{ n: 10, price: 30 }, { n: 30, price: 80 }, { n: 60, price: 150 }].map(function (pk) { return { n: pk.n, price: pk.price, aria: '꽃잎 ' + pk.n + '장 · 옥 ' + pk.price, ask: function () { self.setState({ ask: pk }); } }; });
    var missions = M.map(function (m) {
      var done = m.cur >= m.max, got = !!(sea.claimed || {})[m.id];
      return {
        name: m.name, prog: Math.min(m.cur, m.max) + '/' + m.max,
        bar: 'height:100%;border-radius:4px;background:#D46A86;width:' + Math.min(100, m.cur / m.max * 100) + '%',
        btnLabel: got ? '받음' : '+' + m.reward,
        btn: 'all:unset;cursor:pointer;flex:0 0 56px;box-sizing:border-box;min-height:40px;display:flex;align-items:center;justify-content:center;padding:0;border-radius:11px;font-family:Jua,sans-serif;font-size:13px;' + (got ? 'background:#EBDDE0;color:#7E6670;border:2px solid #D8C3C8' : (done ? 'background:#D46A86;color:#FFF;border:2px solid #A94767;box-shadow:0 2px 0 #A94767' : 'background:#FFF8F5;color:#9A6170;border:2px solid #E6C3CC')),
        claim: function () {
          if (got) { return; }
          if (!done) { self.say('아직 조건을 채우지 못했어요 · ' + Math.min(m.cur, m.max) + '/' + m.max); return; }
          var c = {}; for (var x in (sea.claimed || {})) { c[x] = sea.claimed[x]; } c[m.id] = true;
          self.setG({ season: save({ petals: sea.petals + m.reward, claimed: c }) });
          self.say('꽃잎 +' + m.reward);
        }
      };
    });
    var I = [
      { id: 'etix', name: '축제 채집권', kind: '채집권', res: 'ITEM_ETIX', emoji: '🌸', price: 10, col: '#F7D3DD', rep: true, apply: function (p) { var ga = {}; for (var x in (g.gather || {})) { ga[x] = g.gather[x]; } ga.etix = (ga.etix == null ? 3 : ga.etix) + 1; p.gather = ga; } },
      { id: 'tix', name: '채집권', kind: '채집권', res: 'ITEM_TIX', emoji: '🎫', price: 6, col: '#FFE7A8', rep: true, apply: function (p) { var ga = {}; for (var x in (g.gather || {})) { ga[x] = g.gather[x]; } ga.tix = (ga.tix == null ? 5 : ga.tix) + 1; p.gather = ga; } },
      { id: 'plum', name: '매화 문양', kind: '한정 문양', res: 'PTN_PLUM', img: '_blob/b570ded58d448dba37db6e748cf57424.webp', price: 20, col: '#FCEBD8', apply: function (p) { var pt = {}; for (var x in (g.patterns || {})) { pt[x] = g.patterns[x]; } pt.plum = true; p.patterns = pt; } },
      { id: 'teabed', name: '다회 평상', kind: '한정 가구', res: 'DECO_TEABED', img: '_blob/7480af1a2e3666be0fe08ab90f2616f2.webp', price: 40, col: '#E8D5B7', apply: function (p) { var d = {}; for (var x in (g.deco || {})) { d[x] = g.deco[x]; } d.teabed = true; p.deco = d; } },
      { id: 'lantern', name: '꽃 등롱', kind: '한정 가구', res: 'DECO_FLOWER_LAMP', img: '_blob/0ddf322aaf48ab6e1f34af33fbd75920.webp', price: 15, col: '#FFE7A8', apply: function (p) { var d = {}; for (var x in (g.deco || {})) { d[x] = g.deco[x]; } d.flowerlamp = true; p.deco = d; } },
      { id: 'invite', name: '다회 초대장', kind: '특별 손님', res: 'ITEM_INVITE', img: '_blob/efb9f0de474660761633b5ce70321809.webp', price: 35, col: '#EDE3F3', apply: function (p) { p.inviteGuest = true; } }
    ];
    var items = I.map(function (it) {
      var got = !it.rep && !!(sea.bought || {})[it.id], afford = sea.petals >= it.price;
      return {
        name: it.name, kind: it.kind, res: it.res, img: it.img || '', imgOn: !!it.img, emoji: it.emoji || '', emojiOn: !it.img, aria: it.name + ' · 꽃잎 ' + it.price + (got ? ' · 구매 완료' : ''),
        price: got ? '구매 완료' : '꽃잎 ' + it.price,
        card: 'all:unset;cursor:pointer;position:relative;aspect-ratio:1 / 1.25;box-sizing:border-box;padding:8px 4px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;' + (got ? 'background:#EFE6E8;border:3px solid #D8C3C8;opacity:.75' : 'background:#FFF8F5;border:3px solid #D46A86;box-shadow:0 3px 0 #A94767'),
        kindStyle: 'position:absolute;left:5px;top:5px;padding:0 5px;border-radius:6px;background:#7A2F44;font-size:10.5px;font-weight:700;color:#FFE7EE',
        icon: 'margin-top:8px;width:54px;height:54px;box-sizing:border-box;border:2px solid rgba(91,58,36,.25);border-radius:12px;background:' + it.col + ';display:flex;align-items:center;justify-content:center;text-align:center;color:#7A2F44',
        priceStyle: 'padding:1px 8px;border-radius:8px;font-family:Jua,sans-serif;font-size:11.5px;' + (got ? 'background:#D8C3C8;color:#FFF' : (afford ? 'background:#D46A86;color:#FFF' : 'background:#F1D5DC;color:#A94767')),
        buy: function () {
          if (got) { self.say('이미 가지고 있어요'); return; }
          if (!afford) { self.say('꽃잎이 ' + (it.price - sea.petals) + '장 부족해요 · 축제 미션으로 모아요'); return; }
          var b = {}; for (var x in (sea.bought || {})) { b[x] = sea.bought[x]; } if (!it.rep) { b[it.id] = true; }
          var p = { season: save({ petals: sea.petals - it.price, bought: b }) };
          it.apply(p);
          self.setG(p);
          self.say(it.rep ? it.name + ' +1 · 채집 화면에서 써요' : it.name + ' 획득 · ' + it.kind);
        }
      };
    });
    return {
      goSeasonStage: function () { try { localStorage.setItem('ctab', 'req'); } catch (e) {} },
      petals: sea.petals, dday: Math.max(0, Math.ceil((new Date('2026-11-17T00:00:00+09:00') - Date.now()) / 86400000)),
      missions: missions, items: items, toast: s.toast, toastOn: s.toast !== '',
      jade: jade.toLocaleString(), packs: packs,
      askOn: !!s.ask, ask: s.ask ? { n: s.ask.n, price: s.ask.price, after: (jade - s.ask.price).toLocaleString() } : { n: 0, price: 0, after: '' },
      askNo: function () { self.setState({ ask: null }); },
      askBg: function (e) { if (e && e.target === e.currentTarget) { self.setState({ ask: null }); } },
      askYes: function () {
        var a = self.state.ask; if (!a) { return; }
        var j0 = self.jadeOf(self.loadG());
        if (j0 < a.price) { self.setState({ ask: null }); self.say('옥이 ' + (a.price - j0) + '개 부족해요 · 상점에서 충전'); return; }
        var sea0 = self.loadG().season || sea;
        self.setG({ jadeV: 2, jade: j0 - a.price, season: { petals: (sea0.petals || 0) + a.n, claimed: sea0.claimed || {}, bought: sea0.bought || {} } });
        self.setState({ ask: null }); self.say('꽃잎 +' + a.n);
      }
    };
  }
}
</script>
